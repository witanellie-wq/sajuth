<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직원 근태 · 업무태도 관리 · HANAHAYAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+Thai:wght@300;400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131C2E; --ink-soft:#5A6472; --paper:#F6F7F5; --card:#FFFFFF;
    --line:#DFE3E0; --line-soft:#EDEFEC;
    --jade:#2E7D6B; --amber:#C98A0E; --coral:#BE4237; --violet:#5B4B8A; --slate:#69758A;
    --r:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Noto Sans KR','Noto Sans Thai',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  body.th{font-family:'Noto Sans Thai','Noto Sans KR',system-ui,sans-serif;line-height:1.7;}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 80px;}
  body.locked .wrap{display:none;}

  header{border-bottom:2px solid var(--ink);padding-bottom:12px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);}
  h1{margin:4px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .sub{font-size:12px;color:var(--ink-soft);font-weight:300;margin-top:2px;}
  .hd-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .today{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}

  /* language switch */
  .lang{display:flex;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden;}
  .lang button{background:#fff;border:none;padding:7px 14px;font-size:12.5px;font-weight:700;
    cursor:pointer;color:var(--ink-soft);font-family:'Noto Sans KR','Noto Sans Thai',sans-serif;}
  .lang button + button{border-left:1px solid var(--line);}
  .lang button.on{background:var(--ink);color:#fff;}

  .bk-open{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;
    font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-soft);}
  .bk-open:hover{border-color:var(--ink);color:var(--ink);}

  nav{display:flex;margin:18px 0 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  nav button{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;
    padding:11px 15px;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;}
  nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink);}
  .view{display:none;} .view.on{display:block;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;}
  .panel h2{margin:0 0 16px;font-size:12.5px;font-weight:700;letter-spacing:.05em;
    padding-bottom:8px;border-bottom:1px solid var(--line);}

  label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-soft);margin:0 0 5px;}
  input,select,textarea,button{font-family:inherit;font-size:14px;color:var(--ink);}
  input[type=text],input[type=time],input[type=date],input[type=month],input[type=password],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:#FCFDFC;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--jade);box-shadow:0 0 0 3px rgba(46,125,107,.14);}
  textarea{resize:vertical;min-height:62px;}
  .field{margin-bottom:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row2 .field{margin-bottom:0;}
  .nowbtn{margin-top:6px;font-size:11px;background:none;border:none;color:var(--jade);cursor:pointer;
    padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px;font-family:inherit;}
  .ghost{background:none;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;
    font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-soft);}
  .ghost:hover{border-color:var(--ink);color:var(--ink);}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar input,.toolbar select{width:auto;font-size:13px;padding:7px 9px;}

  .cols{display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start;}
  @media(max-width:900px){.cols{grid-template-columns:1fr;}}

  .readout{font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;
    padding:12px 14px;background:#EFF1EE;border-left:3px solid var(--line);margin:14px 0;}
  .readout small{display:block;font-family:inherit;font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px;}
  body.th .readout small{font-family:'Noto Sans Thai',sans-serif;}
  .readout.late{border-left-color:var(--coral);color:var(--coral);background:#FBF0EF;}
  .readout.ok{border-left-color:var(--jade);color:var(--jade);background:#EEF5F3;}
  .readout.flat{font-size:16px;font-family:inherit;font-weight:700;}

  .types{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .types input{position:absolute;opacity:0;pointer-events:none;}
  .types label{margin:0;padding:9px 6px;text-align:center;border:1px solid var(--line);border-radius:var(--r);
    cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-soft);background:#FCFDFC;}
  .types input:checked + label{background:var(--ink);border-color:var(--ink);color:#fff;}
  .types input:focus-visible + label{box-shadow:0 0 0 3px rgba(46,125,107,.3);}

  .score{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line);}
  .score:last-of-type{border-bottom:none;}
  .score span{font-size:12.5px;font-weight:500;}
  .dots{display:flex;gap:4px;}
  .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);padding:0;line-height:1;}
  .dot.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600;}
  .dot.on.low{background:var(--coral);border-color:var(--coral);}
  .save{width:100%;margin-top:16px;padding:12px;background:var(--ink);color:#fff;border:none;
    border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;}
  .save:hover{background:#000;}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line-soft);font-size:13px;}
  th{font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--ink);}
  td.num,th.num{text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:500;}
  th.num{font-family:inherit;}
  td.bad{color:var(--coral);font-weight:600;}
  td.off{color:var(--slate);}

  .grid-scroll{overflow-x:auto;}
  table.grid{border-collapse:separate;border-spacing:2px;}
  table.grid th.d{font-size:9.5px;width:24px;text-align:center;padding:2px 0;border:none;color:var(--ink-soft);font-weight:500;letter-spacing:0;}
  table.grid th.d.we{color:var(--coral);}
  table.grid th.nm{border:none;text-align:left;min-width:110px;padding-left:0;}
  table.grid td.nm{border:none;font-size:13px;font-weight:700;white-space:nowrap;padding-left:0;}
  table.grid td.sum{border:none;font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;padding:0 0 0 6px;}
  .cell{width:24px;height:26px;border-radius:2px;background:var(--line-soft);border:none;padding:0;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#B9BFBA;cursor:default;}
  body.th .cell{font-family:'Noto Sans Thai',sans-serif;font-size:10px;}
  /* 색은 '출근 구분'과 '태도 점수' 중 나쁜 쪽을 따릅니다 (sev() 참고) */
  .cell.sv0{background:#B4DCCF;color:#17564A;}      /* 우수 4.5+ */
  .cell.sv1{background:#DDECE7;color:var(--jade);}   /* 정상 */
  .cell.sv2{background:#F7EBCE;color:var(--amber);}  /* 주의 */
  .cell.sv3{background:#F2D5D2;color:var(--coral);}  /* 문제 */
  .cell.svSick{background:#E4DFEF;color:var(--violet);}
  .cell.svOff{background:#D8DDE4;color:var(--slate);}
  .cell.휴무{cursor:pointer;}
  .cell.reg-off{background:#EAEDF1;color:#A7B0BC;display:inline-block;line-height:26px;}
  .cell.mark-off{cursor:pointer;}
  .cell.mark-off:hover{background:#D8DDE4;color:var(--slate);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--ink-soft);}
  .legend b{display:inline-block;width:18px;height:18px;border-radius:2px;text-align:center;line-height:18px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;margin-right:5px;vertical-align:-4px;}

  .tier{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .t0,.t1{background:#EEF5F3;color:var(--jade);} .t2{background:#FBF4E3;color:var(--amber);}
  .t3{background:#FBF0EF;color:var(--coral);} .t4{background:#F0EDF6;color:var(--violet);}
  .gr{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .gr.A{color:var(--jade);} .gr.B{color:var(--ink);} .gr.C{color:var(--amber);} .gr.D{color:var(--coral);}

  .entry{border-left:3px solid var(--line);padding:9px 0 9px 12px;margin-bottom:7px;background:#FCFDFC;
    display:flex;gap:12px;align-items:flex-start;}
  .entry.sv0{border-left-color:#17564A;background:#F7FBF9;}
  .entry.sv1{border-left-color:var(--jade);}
  .entry.sv2{border-left-color:var(--amber);background:#FDFBF5;}
  .entry.sv3{border-left-color:var(--coral);background:#FDF7F6;}
  .entry.svSick{border-left-color:var(--violet);}
  .entry.svOff{border-left-color:var(--slate);}
  .sc{font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .sc.sv0{color:#17564A;} .sc.sv1{color:var(--jade);}
  .sc.sv2{color:var(--amber);} .sc.sv3{color:var(--coral);}
  .legend2{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;padding-top:8px;
    border-top:1px dotted var(--line);font-size:11px;color:var(--ink-soft);align-items:center;}
  .legend2 b{display:inline-block;width:18px;height:18px;border-radius:2px;margin-right:5px;vertical-align:-4px;}
  .entry .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);min-width:92px;}
  .entry .body{flex:1;font-size:13px;}
  .entry .body em{font-style:normal;color:var(--ink-soft);}
  .entry .body p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .del{background:none;border:none;color:var(--line);cursor:pointer;font-size:16px;padding:2px 4px;}
  .del:hover{color:var(--coral);}
  .empty{padding:28px 10px;text-align:center;color:var(--ink-soft);font-size:13px;border:1px dashed var(--line);border-radius:var(--r);}
  .note{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}

  .hr-add{display:flex;gap:10px;align-items:flex-end;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
  @media(max-width:600px){.hr-add{flex-wrap:wrap;}}
  #hrTable input[type=text],#hrTable input[type=time]{border-color:transparent;background:transparent;padding:5px 6px;font-weight:500;}
  #hrTable input:hover{border-color:var(--line);background:#FCFDFC;}
  #hrTable input:focus{border-color:var(--jade);background:#fff;}
  .rm{background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--ink-soft);
    font-size:11px;padding:4px 10px;cursor:pointer;font-family:inherit;}
  .rm:hover{border-color:var(--coral);color:var(--coral);}
  .rm:disabled{opacity:.35;cursor:not-allowed;}
  .dow{display:flex;gap:3px;}
  .dw{width:28px;height:26px;border:1px solid var(--line);border-radius:2px;background:#FCFDFC;
    font-size:11px;font-weight:500;color:var(--ink-soft);cursor:pointer;padding:0;font-family:inherit;}
  .dw.su{color:var(--coral);} .dw.sa{color:#4A6FA5;}
  .dw:hover{border-color:var(--ink);}
  .dw.on{background:var(--slate);border-color:var(--slate);color:#fff!important;font-weight:700;}

  /* warnings */
  .wcard{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
  .wcard.fire{border-color:var(--coral);background:#FCF3F2;}
  .wcard-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .wcard-top b{font-size:14px;font-weight:700;}
  .wpips{display:flex;gap:5px;}
  .wpip{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;
    font-weight:600;color:#C3C8C3;background:#fff;}
  .wpip.on{background:var(--coral);border-color:var(--coral);color:#fff;}
  .wpip.thr{border-style:dashed;}
  .fire-badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;background:var(--coral);color:#fff;white-space:nowrap;}
  .wbtn{background:none;border:1px solid var(--coral);color:var(--coral);border-radius:var(--r);
    font-size:11.5px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:inherit;}
  .wbtn:hover{background:var(--coral);color:#fff;}
  .wbtn.v{border-color:var(--amber);color:var(--amber);}
  .wbtn.v:hover{background:var(--amber);color:#fff;}
  .whist{margin-top:10px;padding-top:10px;border-top:1px dotted var(--line);}
  .wrow{display:flex;gap:10px;align-items:flex-start;font-size:12px;padding:4px 0;color:var(--ink-soft);}
  .wrow .wd{font-family:'IBM Plex Mono',monospace;min-width:82px;}
  .wrow .wl{font-weight:700;min-width:78px;}
  .wrow.exp{opacity:.5;text-decoration:line-through;}
  .wrow .wx{margin-left:auto;background:none;border:none;color:var(--line);cursor:pointer;font-size:14px;}
  .wrow .wx:hover{color:var(--coral);}

  /* employment */
  #empTable td{vertical-align:middle;}
  #empTable input,#empTable select{padding:6px 8px;font-size:13px;}
  #empTable input[type=number]{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .intern-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:#EAF0F6;color:#4A6FA5;white-space:nowrap;}
  .intern-badge.done{background:#EFF1EE;color:var(--ink-soft);}
  .pay-est{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--jade);}
  .acct{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--slate);margin-top:2px;}
  .acctcopy{background:none;border:none;color:var(--line);cursor:pointer;font-size:12px;
    padding:0 3px;font-family:inherit;}
  .acctcopy:hover{color:var(--jade);}
  #acTable input{padding:7px 9px;font-size:13px;}
  #pyTable input,#pyTable select{padding:6px 8px;font-size:13px;}
  #pyTable input[data-py="bankAcct"]{font-family:'IBM Plex Mono',monospace;}
  tr.py-off{opacity:.5;}
  /* ── 자동 커미션 ── */
  .bcwarn{background:#FBF4E3;border:1px solid #EBDCB6;border-radius:3px;padding:10px 12px;
    font-size:12px;color:var(--amber);margin-top:10px;}
  .bcmap{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap;}
  .bcmap select{padding:5px 8px;font-size:12.5px;min-width:160px;}
  .bkname{font-weight:700;color:var(--ink);font-size:12px;}
  .bctab td,.bctab th{vertical-align:middle;}
  .bcdate{background:#F7F9F8;text-align:center;white-space:nowrap;}
  .bcdsum{font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:3px;line-height:1.5;}
  .bcsh{display:flex;align-items:center;gap:5px;padding:2px 0;flex-wrap:wrap;}
  .bcsh.bad .bkname{color:var(--coral);}
  .bcsh .mapped{font-size:10px;color:var(--ink-soft);}
  .bcsh .bcamt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;
    font-weight:700;color:var(--jade);}
  input.bcw{width:46px;text-align:right;padding:3px 5px;font-size:11px;
    font-family:'IBM Plex Mono',monospace;}
  input.bcw.on{background:#EEF5F3;font-weight:700;}
  .gwtag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:20px;
    background:#EAF0F6;color:#4A6FA5;margin-top:2px;}
  /* 지출 탭의 직원별 커미션 */
  .commbox{background:#F4F8F6;border:1px solid #CFE2DC;border-radius:3px;padding:11px 13px;margin-top:14px;}
  .commbox h4{margin:0 0 8px;font-size:12px;color:var(--jade);font-weight:700;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .commbox h4 b{font-family:'IBM Plex Mono',monospace;font-size:14px;}
  .commbox .gotopay{margin-left:auto;padding:4px 10px;font-size:11px;}
  .commrow{display:flex;flex-wrap:wrap;gap:6px;}
  .commchip{background:#fff;border:1px solid #CFE2DC;border-radius:20px;padding:4px 11px;
    font-size:11.5px;display:inline-flex;align-items:center;gap:6px;}
  .commchip b{font-family:'IBM Plex Mono',monospace;color:var(--jade);}
  .bctools{display:flex;align-items:center;gap:7px;margin:10px 0 8px;flex-wrap:wrap;}
  .bctools .ghost{padding:5px 11px;font-size:11.5px;}
  .bchint{font-size:11px;color:var(--ink-soft);}
  tr.bcday{cursor:pointer;background:#F7F9F8;}
  tr.bcday:hover{background:#EEF5F3;}
  tr.bcday.open{background:#EEF5F3;}
  tr.bcday td{border-bottom:1px solid var(--line);padding-top:9px;padding-bottom:9px;}
  tr.bcday.off{opacity:.5;}
  tr.bcday.off .pay-est{color:var(--ink-soft);text-decoration:line-through;}
  .bcarrow{text-align:center;color:var(--ink-soft);font-size:11px;}
  .bcdw{font-size:10.5px;color:var(--ink-soft);margin-left:3px;}
  .bcwho{font-size:10.5px;color:var(--ink-soft);}
  .bcwho span{display:inline-block;margin-right:6px;white-space:nowrap;}
  /* 금액을 맞춰 본 줄 — 옅게 깔아 두면 남은 줄이 눈에 들어옵니다.
     중복(노랑)이 확인(연두)보다 뒤에 와야 노란색이 이깁니다. */
  tr.bcrow.chk td{background:#F6FAF8;}
  /* 예약장부에 없어 직접 넣은 건 */
  tr.bcrow.man td{background:#FAF8FC;}
  tr.bcrow.addrow td{background:#F7F8F7;}
  .bcadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .wchip.sm{padding:4px 11px;font-size:11.5px;font-weight:600;border-width:1px;}
  .bcadd.warn{outline:2px solid var(--coral);outline-offset:3px;border-radius:4px;}
  .wchip.gwchip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;}
  .wchip.gwchip.on{background:var(--amber);border-color:var(--amber);}
  .bcadd .bcaddmemo{flex:1;min-width:130px;padding:6px 9px;font-size:12.5px;}
  .bcadd .bcaddamt{width:110px;padding:6px 9px;font-size:13px;font-weight:700;text-align:right;
    font-family:'IBM Plex Mono',monospace;}
  .bcadd .save{width:auto;margin-top:0;padding:6px 16px;font-size:12.5px;flex:0 0 auto;}
  input.bcedit.tr{font-size:11.5px;color:var(--ink);}
  .bcshx{background:none;border:none;cursor:pointer;color:var(--line);font-size:13px;
    line-height:1;padding:0 3px 0 0;font-family:inherit;}
  .bcshx:hover{color:var(--coral);}
  select.bcaddwho{font-size:10px;padding:2px 4px;margin-top:3px;border:1px dashed var(--line);
    border-radius:3px;background:none;color:var(--ink-soft);font-family:inherit;max-width:100%;}
  select.bcaddwho:hover{border-color:var(--jade);color:var(--jade);}
  select.paysel{font-size:10px;padding:2px 4px;margin-top:3px;border:1px solid var(--line);
    border-radius:3px;background:none;color:var(--ink-soft);font-family:inherit;max-width:100%;}
  select.paysel.gw{color:var(--amber);border-color:#EBDCB6;background:#FBF4E3;}
  select.paysel.on{font-weight:700;border-color:var(--jade);}

  /* modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(19,28,46,.55);z-index:50;padding:24px;overflow:auto;}

  /* ── 비밀번호 게이트 ── */

    background:#EEF5F3;color:var(--jade);border:1px solid #CFE2DC;cursor:pointer;}
  body:not(.adm) .adm-only{display:none!important;}
  body.adm #admOpenBtn{display:none!important;}
  body.adm .lockbox{display:none!important;}
  body.adm .lockbox-wrap{display:none!important;}

  /* ── 지출 요약 카드 ── */
  .sumcards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  @media(max-width:1000px){.sumcards{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:640px){.sumcards{grid-template-columns:1fr 1fr;}}
  .sumcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#FCFDFC;}
  .sumcard b{display:block;font-size:10px;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .sumcard i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
  .sumcard small{display:block;font-size:10px;color:var(--ink-soft);margin-top:2px;font-family:inherit;}
  .sumcard.total{background:var(--ink);border-color:var(--ink);}
  .sumcard.total b{color:#9AA5B5;} .sumcard.total i,.sumcard.total small{color:#fff;}
  /* 급여 + 고정비 = 매달 반드시 나가는 돈 */
  .sumcard.sub{background:#F1F7F5;border-color:#CFE2DC;}
  .sumcard.sub i{color:var(--jade);}
  .duebox{margin-top:14px;border:1px solid var(--amber);background:#FDF8EC;border-radius:var(--r);
    padding:11px 14px;font-size:12.5px;color:#8A5E06;}

  /* 지급 상태 토글 — 체크박스는 "체크하면 미지급?" 으로 읽혀서 버튼으로 둡니다 */
  .paybtn{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:6px 14px;
    font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;
    border:1px solid var(--coral);background:#fff;color:var(--coral);}
  .paybtn:hover{background:var(--coral);color:#fff;}
  .paybtn.on{background:var(--jade);border-color:var(--jade);color:#fff;}
  .paybtn.on:hover{background:#fff;color:var(--jade);}
  .paydate{margin-top:5px;padding:4px 6px!important;font-size:11.5px;max-width:140px;}
  /* 분류 콤보 — 직접 입력 + 언제든 목록 열기 (input[list] 는 값이 있으면 목록이 걸러져서 직접 만듭니다) */
  input.hascombo{padding-right:26px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),
                     linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .combo-pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);
    border-radius:var(--r);box-shadow:0 10px 28px rgba(19,28,46,.18);
    max-height:240px;overflow:auto;min-width:150px;display:none;padding:4px 0;}
  .combo-pop.on{display:block;}
  .combo-pop button{display:block;width:100%;text-align:left;background:none;border:none;
    padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .combo-pop button:hover{background:#EEF5F3;}
  .combo-pop button small{color:var(--ink-soft);margin-left:7px;font-size:11px;}
  .combo-pop .chd{padding:6px 13px 4px;font-size:10px;letter-spacing:.05em;
    color:var(--ink-soft);font-weight:600;border-top:1px solid var(--line-soft);margin-top:3px;}
  .combo-pop .chd:first-child{border-top:none;margin-top:0;}
  .fx-off td{opacity:.45;}
  #tgTable input[type=number]{width:100%;text-align:right;font-family:'IBM Plex Mono',monospace;padding:7px 9px;}
  .profit{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;
    font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .profit b{font-family:'IBM Plex Mono',monospace;font-size:15px;}
  .profit.plus{border-color:#CFE2DC;background:#F1F7F5;} .profit.plus b{color:var(--jade);}
  .profit.minus{border-color:var(--coral);background:#FCF3F2;} .profit.minus b{color:var(--coral);}
  .profit .eq{color:var(--ink-soft);font-size:12px;}
  #exList{overflow-x:auto;}
  #cmList{overflow-x:auto;}
  #fixTable input[type=number],#fixTable input[type=text]{padding:6px 8px;font-size:13px;}
  #fixTable input[type=number]{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .catbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line-soft);margin-bottom:8px;}
  .catbar span{display:block;height:9px;}
  .catlist{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);}
  .catlist b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0;}

  /* ── 동기화 상태 표시 ── */
  .netbar{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;
    align-items:flex-end;gap:6px;font-size:11.5px;}
  .netpill{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:5px 12px;box-shadow:0 3px 12px rgba(19,28,46,.10);color:var(--ink-soft);}
  .netdot{width:8px;height:8px;border-radius:50%;background:var(--jade);flex:none;}
  .netdot.off{background:var(--slate);} .netdot.err{background:var(--coral);}
  .neterr{display:none;background:#FBF0EF;border:1px solid var(--coral);color:var(--coral);
    border-radius:var(--r);padding:9px 13px;max-width:320px;font-weight:600;line-height:1.5;
    box-shadow:0 3px 12px rgba(19,28,46,.14);}
  .neterr.on{display:block;}
  .neterr button{margin-top:7px;background:var(--coral);color:#fff;border:none;border-radius:var(--r);
    padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .neterr small{display:block;font-weight:400;font-size:10.5px;opacity:.8;margin-top:4px;
    font-family:'IBM Plex Mono',monospace;word-break:break-all;}

  /* eval sheet — 항상 한/태 병기 */
  .sheet{background:#fff;border:1px solid var(--line);padding:34px 36px;margin-top:18px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:20px;}
  .sheet-head h3{margin:0;font-size:19px;font-weight:700;}
  .sheet-head h3 span{display:block;font-family:'Noto Sans Thai';font-weight:300;font-size:12px;color:var(--ink-soft);}
  .sheet-head .id{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:right;}
  .sheet u{text-decoration:none;font-family:'Noto Sans Thai';font-weight:300;font-size:10.5px;color:var(--ink-soft);}
  .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:22px;}
  .meta-grid > div{padding:9px 11px;border-right:1px solid var(--line-soft);}
  .meta-grid > div:last-child{border-right:none;}
  .meta-grid b{display:block;font-size:9.5px;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
  .meta-grid i{font-style:normal;font-size:14px;font-weight:500;}
  .sh2{font-size:11px;font-weight:700;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 10px;}
  .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:34px;}
  .sign div{border-top:1px solid var(--ink);padding-top:7px;font-size:11px;color:var(--ink-soft);}
  .sign div em{font-style:normal;display:block;height:34px;}

  @page{ size:A4 portrait; margin:12mm 12mm 14mm; }
  /* ══════════ 인쇄 — A4 기준 ══════════
     화면은 1120px 폭이라 그대로 뽑으면 A4(여백 빼고 186mm)를 넘칩니다.
     표를 table-layout:fixed 로 잡고 글자를 pt 로 내려 잘리지 않게 합니다. */
  @media print{
    nav,.toolbar,.del,.save,header,.no-print,.modal,.bk-open,.lang,.netbar,.gate,
    .lockbox,.lockbox-wrap,.hr-add,.rbbtn,.acctcopy,.paybtn,.rm,.wbtn,.dw{display:none!important;}

    body.rcprint .wrap,body.rcprint .netbar{display:none!important;}

      background:#fff!important;padding:0!important;overflow:visible!important;z-index:auto!important;}
    body.rcprint #rcModal .modal-box{box-shadow:none!important;border:none!important;
      padding:0!important;max-width:none!important;width:100%!important;}
    body.rcprint .rcpaper{border:none!important;padding:0!important;}
    body.rcprint table.rcitem{table-layout:auto!important;}
    body.rcprint .rcmeta{font-size:9pt;}
    body.rcprint table.rcitem th,body.rcprint table.rcitem td{font-size:9pt;padding:2mm;}
    body.rcprint table.rcitem tfoot th{font-size:11pt;}
    body.rcprint .rcsign{margin-top:26mm;}
    html,body{width:auto!important;background:#fff!important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .wrap{padding:0!important;margin:0!important;max-width:none!important;width:100%!important;}
    .view{display:none!important;} .view.on{display:block!important;}
    #v-doc .panel{display:none!important;}
    .panel{border:none!important;padding:0!important;margin:0 0 10mm!important;background:#fff!important;}
    .panel h2{font-size:10pt;margin:0 0 4mm;}

    /* 표 — 화면 폭을 따라가지 않도록 */
    table{width:100%!important;max-width:100%!important;table-layout:fixed;border-collapse:collapse;}
    th,td{word-break:break-word;overflow-wrap:anywhere;}
    thead{display:table-header-group;}          /* 여러 장이면 머리글 반복 */
    tr{page-break-inside:avoid;}
    .grid-scroll,#exList,#cmList,#whList,[style*="overflow-x"]{overflow:visible!important;}

    /* 인사 서식 · 평가서 */
    .sheet{border:none!important;padding:0!important;margin:0!important;box-shadow:none!important;}
    #docSheet{font-size:9pt;}
    #docSheet h2.fm-title{font-size:15pt;margin:0;}
    #docSheet h2.fm-title.ko{font-size:10.5pt;margin:1mm 0 5mm;padding-bottom:3mm;}

    #docSheet h3.fm-sec span{font-size:8.5pt;}
    #docSheet h4{font-size:9pt;margin:3mm 0 1mm;page-break-after:avoid;}
    #docSheet p{font-size:8.6pt;line-height:1.55;margin:1.5mm 0;}
    #docSheet blockquote{font-size:8.2pt;padding:2mm 3mm;margin:3mm 0;}
    table.fm-t{margin:2mm 0 4mm;}
    table.fm-t th,table.fm-t td{font-size:8pt;line-height:1.6;padding:1.3mm 2mm;border:0.4pt solid #888;}
    #docSheet .th{line-height:1.95;} #docSheet .ko{line-height:1.55;}
    #docSheet p.fm-note,#docSheet .nt{font-size:7.4pt;line-height:1.45;}
    #docSheet p.fm-meta{font-size:7.8pt;margin:0 0 5mm;padding-bottom:3mm;}
    table.fm-t th{background:#F2F4F1!important;font-size:7.6pt;}
    .fm-fill{background:none!important;} .fm-fill b{color:#000!important;}

    /* 월 근태표 — 31칸이라 가장 빡빡합니다 */
    table.grid{border-spacing:1px;table-layout:auto;}
    table.grid th.d{font-size:5.5pt;width:auto;}
    table.grid td.nm,table.grid th.nm{font-size:7.5pt;min-width:0;}
    table.grid .cell{width:auto;min-width:5.2mm;height:5.2mm;font-size:6pt;line-height:5.2mm;}
    .legend,.legend2{font-size:7pt;gap:3mm;}

    /* 급여 · 지출 — 입력칸을 글자처럼 */

    #payTable select,#fixTable select,#exList select,#whList select{
      border:none!important;background:none!important;padding:0!important;
      font-size:8pt!important;-webkit-appearance:none;appearance:none;}
    .sumcards{grid-template-columns:repeat(5,1fr)!important;gap:2mm;}
    .sumcard{padding:2mm 2.5mm;} .sumcard i{font-size:11pt;} .sumcard b{font-size:6.5pt;}
    .rbbox,.duebox,.profit{padding:2mm 3mm;font-size:8pt;}

    /* 평가서 */
    .sign{margin-top:8mm;gap:8mm;} .sign div{font-size:8pt;} .sign div em{height:12mm;}
    .meta-grid b{font-size:6.5pt;} .meta-grid i{font-size:9pt;}

  bcNote:'<b>예약장부(부킹테이블)에 직원이 입력한 방문 기록</b>에서 커미션을 자동으로 계산합니다 — 매출을 여기에 다시 입력하지 않으셔도 됩니다.<br>상태가 <b>방문</b>인 건만 계산에 들어갑니다. 예약·취소 건은 빠집니다.<br><b>날짜 줄을 누르면</b> 그날 건이 펼쳐집니다. 고객 이름 아래에 <b>전화번호</b>가 같이 나옵니다.<br><b>커미션 시작일</b>을 넣으면 그 날짜부터만 계산합니다 (중간부터 주기 시작한 달). 시작일 뒤라도 특정 날을 빼려면 날짜 옆 <b>지급</b> 단추를 눌러 <b>제외</b>로 바꾸세요.<br><b>실제 결제</b> 칸은 예약장부 금액과 실제로 받은 돈이 다를 때만 넣으세요 — 넣으면 노랗게 표시되고 그 금액으로 계산됩니다. <b>예약장부 원본은 바뀌지 않습니다.</b><br>한 건을 <b>여러 명이 했을 때</b>는 기본이 똑같이 나누기이고, 옆의 작은 칸에 숫자를 넣으면 그 비율로 나뉩니다 (예: 60 과 40).<br><b>예약장부에 아예 안 들어간 건</b>은 <b>그 날짜를 펼친 맨 아래 줄</b>에서 바로 넣으세요 — 담당자를 누르고 금액을 치면 <b>Enter</b> 로 들어갑니다 (내용은 안 써도 됩니다). 고와비 건이면 <b>GoWabi −20%</b> 도 같이 눌러 두세요 — 수수료를 뺀 금액에 커미션이 붙습니다. 넣은 뒤에도 그 줄에서 바꿀 수 있습니다. <b>직접 입력</b> 으로 그 자리에 바로 나오고, 그날 매출 · 매출보정 · 합계 · 급여표에 모두 들어갑니다. 아래 <b>커미션 내역</b>에서 넣어도 똑같습니다. 잘못 넣었으면 그 줄 왼쪽 <b>×</b> 로 바로 지울 수 있고, <b>고치기</b> 를 누르면 아래 커미션 내역의 그 날짜로 갑니다.<br>여기서 나온 직원별 합계는 위 <b>급여표의 커미션 칸</b>에 자동으로 들어갑니다. 급여표에서 직접 고쳐 쓰면 그 값이 우선합니다.<br><b>기준금액이 정해지는 순서</b>: 실제 결제액 → 고와비 수수료 뺌 → <b>VAT 뺌</b> → 비율 곱함.<br><b>VAT 제외</b>에 7 을 넣으면 가격에 VAT 가 포함돼 있다고 보고 1.07 로 나눈 금액에 커미션을 매깁니다 (VAT 는 국세청에 낼 돈이라 가게에 안 남습니다). VAT 미등록이거나 가격이 VAT 별도면 <b>0</b> 으로 두세요.<br><b>중복으로 들어간 건</b>은 같은 날 · 같은 금액 · 같은 시술이면서 전화번호나 이름까지 같을 때 노랗게 <b>중복 의심</b> 으로 표시됩니다. 줄 왼쪽 <b>✕</b> 를 누르면 그 건만 커미션에서 빠집니다 (<b>↺</b> 로 되돌립니다). <b>예약장부 원본은 지워지지 않습니다.</b><br><b>고객 이름 · 전화번호 · 메뉴명 · 담당자는 여기서 바로 고칠 수 있습니다</b> — 칸을 눌러 고치거나, 담당자 옆 <b>×</b> 로 빼고 <b>+ 담당자</b> 로 더하면 <b>예약장부(부킹테이블)의 원본도 같이 바뀝니다.</b> 부킹시트를 열어 둔 기기가 있으면 그쪽도 새로고침해 주세요.<br>같은 날 <b>전화번호가 같은 건</b>은 한 손님으로 보고 나란히 모아 <b>같은 손님 3건 · ฿11,490</b> 처럼 묶어 보여 줍니다.<br><b>매출보정</b>은 그날 실제로 덜 받은 <b>총액</b>을 넣는 칸입니다. 각 건의 금액에 <b>비례해서</b> 나눠 빼고 그 줄어든 금액으로 커미션을 냅니다. 어느 건에서 깎였는지 아신다면 그 줄의 <b>실제 결제</b> 를 고치는 쪽이 맞습니다.<br>부킹시트에 <b>하루 총 매출</b>을 넣으신 날은 <b>확정 ฿9,500 · −฿500 (-5%)</b> 처럼 차액을 대신 계산해 드립니다. 옆의 <b>보정</b> 을 누르면 그 금액이 그대로 들어갑니다. 확정액이 장부보다 <b>많은</b> 날은 장부에 빠진 건이 있다는 뜻이라 자동으로 올리지 않습니다.<br>포스 · 종이와 금액을 맞춰 본 건은 줄 왼쪽 <b>네모</b>를 눌러 <b>확인</b> 표시를 남기세요. 날짜 줄의 <b>확인 7/11</b> 을 /** 그 달에 유효했던 급여 — 이력이 없으면 직원의 현재 급여를 씁니다 */
function wageAt(s,month){
  const h=(data.wageHist||{})[s._id]||[];
  let cur=null;
  for(const x of h){ if(x.fromMonth<=month)cur=x; else break; }
  return cur ? {wage:Number(cur.wage||0),payType:cur.payType||defPayType(s),from:cur.fromMonth,memo:cur.memo}
             : {wage:Number(s.wage||0),payType:defPayType(s),from:null,memo:''};
}
/** 그 달에 급여가 바뀌었는가 (전월 대비) */
function wageChange(s,month){
  const now=wageAt(s,month), before=wageAt(s,prevMonth(month));
  if(!now.from||now.from!==month)return null;              // 이 달부터 적용된 게 아니면 변화 없음
  if(before.wage===now.wage&&before.payType===now.payType)return null;
  return {from:before,to:now,up:now.wage>before.wage};
}

   18 번(커미션 내역)도 같이 들어 있으니 둘 다 돌리시면 됩니다. */
const setupMissing=new Map();          // '표 · 칸 이름' → 실행할 SQL 파일
/** Supabase SQL 편집기 주소 — 프로젝트 주소에서 만들어 냅니다 */
function sqlEditorUrl(){
  const ref=String(CFG.url||'').replace(/^https?:\/\//,'').split('.')[0];
  return ref?`https://supabase.com/dashboard/project/${ref}/sql/new`:'https://supabase.com/dashboard';
}
/** 이 오류가 'SQL 을 아직 안 돌려서' 나는 것이면 기록하고 true */
function noteSetup(e){
  const msg=(e&&(e.message||e.error_description))||String(e);
  const tb=(msg.match(/table '(?:public\.)?([a-z_]+)'/i)
          ||msg.match(/relation "(?:public\.)?([a-z_]+)" does not exist/i)||[])[1];
  if(tb&&/could not find|does not exist/i.test(msg)){
    setupMissing.set(tb,PATCH_OF[tb]||'');
    return true;
  }
  const col=(msg.match(/could not find the '([a-z_]+)' column/i)
           ||msg.match(/column "?([a-z_]+)"? does not exist/i)||[])[1];
  if(col&&COL_PATCH[col]){ setupMissing.set(col,COL_PATCH[col]); return true; }
  return false;
}
function paintSetup(){
  const box=$('setupBox'); if(!box)return;
  if(!setupMissing.size){box.classList.remove('on');box.innerHTML='';return;}
  const files=[...new Set([...setupMissing.values()].filter(Boolean))].sort();
  const names=[...setupMissing.keys()].sort();
  const have=files.filter(f=>SETUP_SQL[f]);
  box.innerHTML=`<b>🛠 ${t('setupTitle')}</b>
    <div class="slist"><span>${names.map(esc).join(' · ')}</span></div>
    ${have.length?`<button id="setupCopy" class="pri">${t('setupCopy')}</button>`:''}
    <a class="setuplink" href="${sqlEditorUrl()}" target="_blank" rel="noopener">${t('setupOpen')} ↗</a>
    <small>${have.length?t('setupCopyHow'):t('setupHow')}</small>
    ${files.length?`<div class="sfiles">${files.map(esc).join(' · ')}</div>`:''}
    <button id="setupX">${t('setupHide')}</button>`;
  box.classList.add('on');
  $('setupX').onclick=()=>{box.classList.remove('on');};
  const cp=$('setupCopy');
  if(cp)cp.onclick=async()=>{
    // 필요한 것만 모아서 한 번에 복사합니다 (파일을 열 필요가 없습니다)
    const sql='-- '+t('setupTitle')+'\n'+have.map(f=>SETUP_SQL[f]).join('\n\n')
      +`\n\nselect '${t('setupDone')}' as "결과";\n`;
    try{ await navigator.clipboard.writeText(sql);
         cp.textContent='✓ '+t('setupCopied');
         setTimeout(()=>{cp.textContent=t('setupCopy');},2500);
    }catch(e){
      // 클립보드가 막혀 있으면 화면에 띄워서 직접 복사하게 합니다
      const ta=document.createElement('textarea');
      ta.value=sql; ta.style.cssText='position:fixed;inset:6% 6% auto;height:70vh;z-index:99;'
        +'font-family:monospace;font-size:12px;padding:10px;border:2px solid #2E7D6B;border-radius:4px';
      document.body.appendChild(ta); ta.select();
      ta.onblur=()=>ta.remove();
    }
  };
}
function setNet(state){ // 'live' | 'con' | 'off'
  const d=$('netDot'),x=$('netTxt');
  d.className='netdot'+(state==='live'?'':state==='off'?' err':' off');
  x.textContent=state==='live'?t('netLive'):state==='off'?t('netOff'):t('netCon');
}
function paintFail(){
  const box=$('netErr');
  if(!failQ.length){box.classList.remove('on');box.innerHTML='';return;}
  const last=failQ[failQ.length-1];
  box.innerHTML=`${t('netFail')}<br>${failQ.length}${t('netFailN')}
    <small>${esc(last.label)} · ${esc(last.msg)}</small>
    <button id="netRetryBtn">${t('netRetry')}</button>`;
  box.classList.add('on');
  $('netRetryBtn').onclick=retryFailed;
}
async function retryFailed(){
  const q=failQ.splice(0,failQ.length); paintFail();
  for(const f of q){ if(f.fn) await op(f.label,f.fn); }
  await loadAll(); safeRender();
}
/** Supabase 호출 래퍼 — 실패하면 화면에 경고를 띄우고 재시도 큐에 넣습니다. */
async function op(label,fn,retryable=true){
  try{
    const r=await fn();
    if(r&&r.error)throw r.error;
    setNet(liveCh?'live':'con');
    return {ok:true,data:r?r.data:null};
  }catch(e){
    // 아직 안 돌린 SQL 때문이면 '설치 안내' 로 보내고 저장실패 경고는 띄우지 않습니다
    if(noteSetup(e)){ paintSetup(); return {ok:false,error:e,setup:true}; }
    const msg=(e&&(e.message||e.error_description))||String(e);
    failQ.push({label,fn:retryable?fn:null,msg});
    setNet('off'); paintFail();
    return {ok:false,error:e};
  }
}

const fixAmt=(c,m)=>{const p=fixPay(c,m);return p.amount!=null?Number(p.amount):Number(c.amount||0);};
/** b 가 비어 있으면 전체 사업장 */
const bizOK=(x,b)=>!b||(x.biz||DEF_BIZ)===b;
const fixListIn=(m,b)=>data.fixedCosts.filter(c=>fixLiveIn(c,m)&&bizOK(c,b));
const fixTotal=(m,b)=>fixListIn(m,b).reduce((a,c)=>a+fixAmt(c,m),0);
const expListIn=(m,b)=>(data.expenses||[]).filter(e=>(e.date||'').startsWith(m)&&bizOK(e,b));
const expTotal=(m,b)=>expListIn(m,b).reduce((a,e)=>a+Number(e.amount||0),0);
const payrollTotal=m=>liveStaff().reduce((a,s)=>a+payCalc(s,m).total,0);
/* 지출 요약에서는 급여를 '기본급(+보너스−공제)' 과 '커미션' 으로 나눠 보여줍니다.
   둘을 더하면 payrollTotal 과 같습니다 — 중복으로 세지 않습니다. */
const payrollBaseTotal=m=>liveStaff().reduce((a,s)=>{
  const c=payCalc(s,m); return a+c.base+c.bonus-c.deduct;},0);
const payrollCommTotal=m=>money2(liveStaff().reduce((a,s)=>a+payCalc(s,m).comm,0));
/* ── 사비 결제 · 정산 ──
   달과 무관하게 '아직 안 갚은 것 전부' 를 봅니다 (지난달 건도 갚을 때까지 남습니다) */
const needsRb=e=>(e.payer||COMPANY)!==COMPANY;
const pendingRb=b=>(data.expenses||[]).filter(e=>needsRb(e)&&!e.reimbursedAt&&bizOK(e,b));
const doneRb=b=>(data.expenses||[]).filter(e=>needsRb(e)&&e.reimbursedAt&&bizOK(e,b));
/** 결제자별 미정산 합계 */
function rbByPayer(b){
  const g={};
  pendingRb(b).forEach(e=>{(g[e.payer]=g[e.payer]||[]).push(e);});
  return Object.entries(g).map(([payer,list])=>({payer,list,
    sum:list.reduce((a,e)=>a+Number(e.amount||0),0)})).sort((x,y)=>y.sum-x.sum);
}

/* ── Realtime 구독 ── */
let reloadT=null,pendingRender=false;
function scheduleReload(){
  clearTimeout(reloadT);
  reloadT=setTimeout(async()=>{await loadAll();safeRender();},400);
}
/** 입력 중에는 다시 그리지 않고, 포커스가 빠질 때 그립니다. */
function safeRender(){
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!ae.closest('.gate,.modal')){
    pendingRender=true; return;
  }
  pendingRender=false; renderStaff(); render();
}
document.addEventListener('focusout',()=>{
  if(pendingRender)setTimeout(()=>{if(pendingRender)safeRender();},120);
});
function subscribeLive(){
  if(liveCh){sb.removeChannel(liveCh);liveCh=null;}
  const ch=sb.channel('staff-sync-'+Math.random().toString(36).slice(2));
  // RLS 로 못 읽는 테이블은 구독하지 않습니다 (직원 계정에서 채널 오류 방지)
  const tables=['staff_members','staff_records','staff_evals']
    .concat(isAdmin?['staff_payroll','staff_commissions','staff_warnings',
                     'staff_fixed_costs','staff_fixed_payments','staff_expenses','staff_targets',
                     'staff_wage_history','staff_payees',
                     'staff_comm_config','staff_name_map','staff_comm_split','staff_comm_override','staff_comm_skip',
                     'bookings']:[]);
  tables.forEach(tb=>ch.on('postgres_changes',{event:'*',schema:'public',table:tb},scheduleReload));
  ch.subscribe(st=>{
    if(st==='SUBSCRIBED'){liveCh=ch;setNet('live');}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){liveCh=null;setNet('off');}
  });
}
window.addEventListener('online',()=>{scheduleReload();subscribeLive();});
window.addEventListener('offline',()=>setNet('off'));

/* ══════════ stats ══════════ */
function isRegOff(name,iso){
  const s=data.staff.find(x=>x.name===name);
  if(!s||!Array.isArray(s.off)||!s.off.length)return false;
  const[Y,M,D]=iso.split('-').map(Number);
  return s.off.includes(new Date(Y,M-1,D).getDay());
}
const daysInMonth=m=>{const[Y,M]=m.split('-').map(Number);return new Date(Y,M,0).getDate();};

/* ── 기록 한 건의 심각도 ──────────────────────────────────────────────
   출근 구분만으로 색을 정하면 "정상 출근인데 태도 1점" 이 초록으로 보입니다.
   그래서 근태 쪽 등급과 태도 점수 등급 중 '나쁜 쪽'을 따릅니다.
     sv0 우수(4.5+) · sv1 정상 · sv2 주의 · sv3 문제 · svSick 병가 · svOff 휴무   */
const SCORE_SEV=a=>a<2.5?3:a<3.5?2:a>=4.5?0:1;
function sev(r){
  if(r.type==='휴무')return 'svOff';
  if(r.type==='병가')return 'svSick';
  let s=(r.type==='무단'||r.type==='무단결근')?3
       :(r.type==='사전통보'||r.type==='사전통보결근')?2
       :(r.late>0)?2:1;
  if(r.avg!=null){
    const a=SCORE_SEV(r.avg);
    s=Math.max(s,a);              // 나쁜 쪽이 이깁니다
    if(a===0&&s===1)s=0;          // 근태도 정상 + 태도도 최고 → 우수
  }
  return 'sv'+s;
}

// 발부일로부터 12개월 이내면 유효
function warnValid(w,ref){
  const iss=new Date(w.date), r=ref?new Date(ref):new Date();
  const exp=new Date(iss); exp.setFullYear(exp.getFullYear()+1);
  return r<exp;
}
// 특정 직원의 유효 서면 경고 수 (기준일 시점)
function activeWarnings(name,ref){
  return (data.warnings||[]).filter(w=>w.staff===name&&w.level==='서면'&&warnValid(w,ref)).length;
}
const canFire=(name,ref)=>activeWarnings(name,ref)>=FIRE_THRESHOLD;

function stat(name,month){
  const rs=data.records.filter(r=>r.staff===name&&r.date.startsWith(month));
  const lateCnt=rs.filter(r=>r.late>0).length;
  const unex=rs.filter(r=>r.type==='무단'||r.type==='무단결근').length;
  const totalLate=rs.reduce((a,r)=>a+(r.late||0),0);
  const avgs=rs.map(r=>r.avg).filter(v=>v!=null);
  const avg=avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null;
  const adj=avg!=null?Math.max(0,avg-unex*0.3):null;
  const grade=adj==null?'–':adj>=4.5?'A':adj>=3.5?'B':adj>=2.5?'C':'D';
  const days=rs.filter(r=>!['휴무','병가','무단결근','사전통보결근'].includes(r.type)).length;
  let off=rs.filter(r=>r.type==='휴무').length;
  const nd=daysInMonth(month);
  for(let d=1;d<=nd;d++){
    const iso=`${month}-${pad(d)}`;
    if(!rs.some(r=>r.date===iso)&&isRegOff(name,iso))off++;
  }
  const sick=rs.filter(r=>r.type==='병가').length;
  const preAbs=rs.filter(r=>r.type==='사전통보결근').length;
  const hours=rs.reduce((a,r)=>a+hoursOf(r),0);
  return{rs,days,off,sick,preAbs,hours,lateCnt,unex,totalLate,avg,adj,grade,tier:Math.min(unex,4)};
}

/* ══════════ 급여 · 커미션 ══════════ */
/* ── 자동 커미션 — 예약장부(다른 앱)의 '방문' 기록에서 계산합니다 ──────────
   예약장부 1건에는 담당자(여러 명 가능) · 결제금액 · 방문여부가 들어 있습니다.
   그걸 읽어 커미션을 내므로 매출을 여기에 다시 입력하지 않습니다.
     기준금액 = 실제 결제액(직접 고친 값) 또는 예약장부 금액
                고와비 건은 수수료를 뺀 실수령액
     커미션   = 기준금액 × 비율(기본 3%) × 담당자 몫                        */
const GW_DEFAULT=20;
const commRate=()=>Number((data.commCfg||{}).rate??3);
/* VAT 등록 사업자는 고객이 낸 돈 중 7% 가 국세청 몫이라 가게에 남지 않습니다.
   태국 관행(원천징수세도 VAT 뺀 금액에 곱함)에 따라 커미션 기준에서 뺍니다.
   0 이면 빼지 않습니다. 가격이 VAT 포함이라고 보고 1.07 로 나눕니다. */
const vatRate=()=>Number((data.commCfg||{}).vatRate||0);
const exVat=x=>{const v=vatRate();return v>0?Number(x||0)/(1+v/100):Number(x||0);};
const gwRate=()=>{const r=data.gwRate;return r==null?GW_DEFAULT:Number(r)||0;};
/** 예약장부에 적힌 대로의 결제 경로 */
const bkPayAuto=b=>(String(b.pay||'')==='GoWabi'||String(b.src||'').toLowerCase()==='gowabi')?'gw':'on';
/** 실제로 쓸 결제 경로 — 직접 고른 값이 있으면 그것 */
const bkPayKind=b=>{const o=(data.commOvr||{})[b.id];
  return (o&&o.payKind)?o.payKind:bkPayAuto(b);};
const isGowabi=b=>bkPayKind(b)==='gw';
/** 예약장부에 적힌 금액 */
const bkGross=b=>Number(b.amount||0);
/** 실제로 받은 금액 — 직접 고쳤으면 그 값 */
const bkPaid=b=>{const o=(data.commOvr||{})[b.id];
  return o&&o.amount!=null?Number(o.amount):bkGross(b);};
const bkEdited=b=>{const o=(data.commOvr||{})[b.id];return !!(o&&o.amount!=null);};
/** 이 건을 커미션에서 뺐는가 (중복 입력 등) */
const bkSkipped=b=>{const o=(data.commOvr||{})[b.id];return !!(o&&o.skip);};
/** 포스 · 종이와 금액을 맞춰 본 건인가 */
const bkChecked=b=>{const o=(data.commOvr||{})[b.id];return !!(o&&o.checked);};
/** 시술 이름 — 여러 개면 붙여서 한 줄로 */
const bkTreatOf=b=>(Array.isArray(b.items)&&b.items.length
  ? b.items.map(it=>it.treat).filter(Boolean).join('+') : (b.treat||'')).trim();
/** 전화번호에서 숫자만 — 적는 모양이 달라도 같은 손님으로 봅니다 */
const digitsOnly=s=>String(s||'').replace(/[^0-9]/g,'');
/** 같은 손님으로 볼 열쇠 — 전화번호가 있으면 그걸로, 없으면 이름 */
const bkWho=b=>digitsOnly(b.phone)||String(b.name||'').trim().toLowerCase();
/** 중복 입력 의심 — 같은 날 · 같은 금액 · 같은 시술인데 손님까지 같은 줄.
    값이 정해진 시술은 금액과 시술만 같은 경우가 워낙 많아서
    (BB Glow 990 처럼) 그것만으로는 세지 않습니다.
    한쪽만 잘못 적히는 일이 있어서 전화번호든 이름이든 하나만 같아도 셉니다.
    손님을 알 수 없는 줄은 비교할 것이 없으니 넘깁니다. */
function dupKeys(b){
  if(bkPaid(b)<=0)return [];
  const tail='|'+Math.round(bkPaid(b))+'|'+bkTreatOf(b);
  const head=String(b.date||'')+'|';
  const ph=digitsOnly(b.phone), nm=String(b.name||'').trim().toLowerCase();
  const out=[];
  if(ph)out.push(head+'p'+ph+tail);
  if(nm)out.push(head+'n'+nm+tail);
  return out;
}
function dupSet(m){
  const cnt={}, out=new Set();
  monthBk(m).forEach(b=>dupKeys(b).forEach(k=>{cnt[k]=(cnt[k]||0)+1;}));
  monthBk(m).forEach(b=>{if(dupKeys(b).some(k=>cnt[k]>1))out.add(b.id);});
  return out;
}
/** 하루치를 손님별로 모읍니다 — 같은 날 같은 번호는 한 손님이 이어서 받은
    시술이라 나란히 붙여 놓아야 읽힙니다. 먼저 온 손님이 위로 옵니다. */
function dayGroup(rows){
  const by=new Map(), order=[];
  rows.forEach(b=>{
    const k=bkWho(b)||('#'+b.id);
    if(!by.has(k)){by.set(k,[]);order.push(k);}
    by.get(k).push(b);
  });
  const list=[], meta=new Map();
  order.forEach(k=>{
    const g=by.get(k);
    g.forEach((b,i)=>{list.push(b);
      meta.set(b.id,{n:g.length,i,first:i===0,last:i===g.length-1,
                     sum:g.reduce((a,x)=>a+bkPaid(x),0)});});
  });
  return {list,meta};
}
/* ── 매출보정 (하루 할인) ────────────────────────────────────────────
   마감하고 보면 실제로 들어온 돈이 예약장부 합계보다 적은 날이 있습니다
   (현장 할인 · 끝자리 깎기). 어느 건에서 얼마가 깎였는지는 알 수 없으니
   그날 깎인 총액을 적어 두고 각 건의 금액에 비례해서 나눠 뺍니다.
   커미션에서 뺀 건(중복 등)은 애초에 받은 돈이 아니라 계산에서 제외합니다. */
const dayDisc=d=>Number((data.commDisc||{})[d]||0);
/** 그날 실제로 받은 돈의 합 (보정 전).
    예약장부에 없어서 커미션 내역에 직접 넣은 건도 그날 받은 돈입니다. */
function dayGross(d){
  let sum=0;
  (data.bookings||[]).forEach(b=>{
    if(b.status==='방문'&&b.date===d&&!bkSkipped(b))sum+=bkPaid(b);});
  (data.commissions||[]).forEach(c=>{
    if(c.date===d&&c.sale!=null)sum+=Number(c.sale)*(c.share==null?1:Number(c.share));});
  return sum;
}
/** 그날 보정을 반영해 곱할 비율 — 1 이면 보정 없음 */
function dayFactor(d){
  const dc=dayDisc(d); if(dc<=0)return 1;
  const g=dayGross(d); if(g<=0)return 1;
  return Math.max(0,g-dc)/g;
}
/** 부킹시트에서 확정한 그날 입금 총액 — 안 넣은 날은 null */
const dayFixed=d=>{const o=(data.dayRev||{})[d];return o&&o.total>0?o.total:null;};
/** 확정 입금 − 예약장부 합계. 음수면 장부보다 덜 들어온 것 = 보정할 금액 */
function dayGap(d){
  const f=dayFixed(d); if(f==null)return null;
  return money2(f-dayGross(d));
}
/** 덜 들어온 비율 (%) — 사장님이 손으로 계산하던 그 숫자입니다 */
function dayGapPct(d){
  const g=dayGross(d), gap=dayGap(d);
  if(gap==null||g<=0)return null;
  return Math.round(gap/g*1000)/10;
}
/** 보정을 비례해서 나눠 뺀 한 건의 금액 */
function bkPaidAdj(b){
  const paid=bkPaid(b);
  if(paid<=0||bkSkipped(b))return paid;
  return money2(paid*dayFactor(b.date));
}
/** 커미션을 매길 기준금액 */
function commBase(b){
  const paid=bkPaidAdj(b);
  if(!isGowabi(b))return exVat(paid);
  const basis=(data.commCfg||{}).gowabiBasis||'net';
  if(basis==='none')return 0;
  if(basis==='gross')return exVat(paid);
  return exVat(Math.round(paid*(100-gwRate())/100));
}
const money2=n=>Math.round(Number(n||0)*100)/100;
/** 이 날짜에 커미션을 주는가 — 시작일 뒤이고, 따로 뺀 날이 아니면 줍니다 */
function commDayOn(d){
  const st=(data.commCfg||{}).startDate||'';
  if(st&&String(d||'')<st)return false;
  return !(data.commSkip&&data.commSkip.has(d));
}
/** 예약장부의 담당자 칸 → 이름 목록 (여러 명이면 쉼표로 들어 있습니다) */
const bkNames=b=>String(b.staff||'').split(/[,·/]/).map(s=>s.trim()).filter(Boolean);
/** 한 건을 담당자별로 나눈 몫. 비율을 안 정했으면 인원수대로 똑같이 나눕니다 */
function commShares(b){
  const ns=bkNames(b); if(!ns.length)return [];
  const sp=data.commSplit||{};
  const ws=ns.map(n=>{const v=sp[b.id+'|'+n];return v==null?1:Math.max(0,Number(v)||0);});
  const tw=ws.reduce((a,x)=>a+x,0);
  const base=commBase(b), min=Number((data.commCfg||{}).minAmount||0);
  const pay=(base>0&&base>=min&&commDayOn(b.date)&&!bkSkipped(b))?base:0;
  const rate=commRate();
  return ns.map((n,i)=>{
    const share=tw>0?ws[i]/tw:0;
    return {name:n,weight:ws[i],custom:sp[b.id+'|'+n]!=null,share,
            amount:money2(pay*share),comm:money2(pay*share*rate/100)};
  });
}
/** 그 달의 '방문' 기록 (실제로 와서 결제한 건) */
const monthBk=m=>(data.bookings||[])
  .filter(b=>b.status==='방문'&&String(b.date||'').startsWith(m))
  .sort((a,b)=>String(a.date).localeCompare(String(b.date))
            ||String(a.time||'').localeCompare(String(b.time||'')));
/** 예약장부 담당자 이름 → 우리 직원. 먼저 직접 이어둔 것, 없으면 이름이 겹치는 사람 */
function autoMatch(n){
  const low=String(n||'').toLowerCase().trim(); if(!low)return null;
  return data.staff.find(s=>{
    const sn=s.name.toLowerCase();
    return sn===low||sn.split(/\s+/).some(p=>p===low)||sn.includes(low)||low.includes(sn);
  })||null;
}
function staffOfBkName(n){
  const id=(data.nameMap||{})[n];
  if(id){const s=data.staff.find(x=>x._id===id);if(s)return s;}
  if(Object.prototype.hasOwnProperty.call(data.nameMap||{},n))return null;  // 일부러 '없음'
  return autoMatch(n);
}
/** 그 달에 이 직원이 받을 자동 커미션 */
function bkCommOf(name,m){
  let sum=0;
  monthBk(m).forEach(b=>commShares(b).forEach(sh=>{
    const s=staffOfBkName(sh.name);
    if(s&&s.name===name)sum+=sh.comm;
  }));
  return money2(sum);
}
/** 예약장부에 있는데 아직 우리 직원과 안 이어진 이름들 */
function unmatchedNames(m){
  const set=new Set();
  monthBk(m).forEach(b=>bkNames(b).forEach(n=>{if(!staffOfBkName(n))set.add(n);}));
  return [...set].sort();
}
/* 판매금액을 넣은 건은 그때그때 계산합니다 — 비율이나 매출보정이 바뀌면 같이 따라갑니다.
   커미션액을 직접 넣은 건(판매금액 없음)은 넣어 둔 금액 그대로입니다. */
const commOf=(name,month)=>(data.commissions||[]).filter(c=>c.staff===name&&(c.date||'').startsWith(month))
  .reduce((a,c)=>a+cmPayoutOf(c),0);
function estPay(s,month){
  const {wage:w,payType:pt}=wageAt(s,month); if(!w)return null;
  const x=stat(s.name,month);
  if(pt==='월급')return w;
  if(pt==='시급')return Math.round(x.hours*w);
  return x.days*w;
}
const payKey=(n,m)=>n+'|'+m;
const payOf=(n,m)=>(data.payroll||{})[payKey(n,m)]||{};
/* 추가 지급 · 공제 내역 — 급여표의 보너스 · 공제 칸에 자동으로 더해집니다 */
const piOf=(name,month)=>(data.payItems||[]).filter(x=>x.staff===name&&x.month===month)
  .sort((a,b)=>(a.seq||0)-(b.seq||0));
const piSum=(name,month,kind)=>money2(piOf(name,month)
  .filter(x=>x.kind===kind).reduce((a,x)=>a+Number(x.amount||0),0));
/** 하루치 급여 — 무급휴가 일수로 금액을 자동 계산할 때 씁니다 */
function dailyWage(s,m){
  const {wage:w,payType:pt}=wageAt(s,m);
  if(!w)return 0;
  if(pt==='일급')return w;
  if(pt==='월급')return money2(w/30);      // 태국 관행: 월급 ÷ 30
  return 0;                                 // 시급은 일수로 환산할 수 없습니다
}
function payCalc(s,m){
  const auto=estPay(s,m)||0;
  const manC=commOf(s.name,m), bkC=bkCommOf(s.name,m), autoC=money2(manC+bkC);
  const p=payOf(s.name,m);
  const base=num(p.base)!=null?num(p.base):auto;
  const comm=numSet(p.comm)!=null?numSet(p.comm):autoC;
  const autoB=piSum(s.name,m,'추가'), autoD=piSum(s.name,m,'공제');
  const bonus=numSet(p.bonus)!=null?numSet(p.bonus):autoB;
  const deduct=numSet(p.deduct)!=null?numSet(p.deduct):autoD;
  return{auto,autoC,manC,bkC,base,comm,autoB,autoD,bonus,deduct,
         total:base+comm+bonus-deduct,p};
}

/** A4 인쇄 — 표가 넓은 화면은 가로(landscape)로 뽑습니다 */
function printAs(orient){
  const st=document.createElement('style');
  st.textContent=`@page{size:A4 ${orient};margin:${orient==='landscape'?'8mm 8mm 10mm':'12mm 12mm 14mm'};}`;
  document.head.appendChild(st);
  const done=()=>{setTimeout(()=>st.remove(),300);window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  window.print();
  setTimeout(done,3000);   // afterprint 를 안 주는 브라우저 대비
}

/** 그 달 납부일이 이미 지났는가 (이번 달일 때만 의미 있음) */
function isPastDue(m,day){
  const now=todayISO();
  if(now.slice(0,7)>m)return true;
  if(now.slice(0,7)<m)return false;
  return Number(now.slice(8,10))>Number(day);
}

/* ══════════ 분류 콤보 — 직접 입력하면서 목록도 언제든 열립니다 ══════════ */
const COMBO={
  fix:  {list:()=>FIXCATS, used:()=>data.fixedCosts.map(c=>c.category),
         head:['catPreset','catMine']},
  exp:  {list:()=>EXCATS,  used:()=>(data.expenses||[]).map(e=>e.category),
         head:['catPreset','catMine']},
  pi:   {list:()=>PIREASON[$('piKind').value||'공제']||[],
         used:()=>(data.payItems||[]).map(x=>x.reason),
         head:['catPreset','catMine']},
  pye:  {list:()=>PYCATS,  used:()=>(data.payees||[]).map(p=>p.category),
         head:['catPreset','catMine']},
  payer:{list:()=>[[COMPANY,'acCompany']], used:()=>payerOptions(),
         head:['payerBase','payerMine']}};
let comboEl=null;
/** filter=true 는 '타이핑 중' 일 때만. 그냥 클릭해서 열면 값이 들어 있어도 전체를 보여줍니다
    (기존 값을 다른 것으로 바꾸려면 전체가 보여야 하니까요) */
function comboOpen(inp,filter){
  const cfg=COMBO[inp.dataset.combo]; if(!cfg)return;
  const pop=$('comboPop'), src=cfg.list();
  const presets=src.map(x=>x[0]);
  const mine=[...new Set(cfg.used())].filter(v=>v&&!presets.includes(v)).sort();
  const cur=(inp.value||'').trim();
  const q=filter?cur.toLowerCase():'';
  const match=v=>{
    if(!q)return true;
    const pr=src.find(x=>x[0]===v);
    return v.toLowerCase().includes(q)||(pr&&t(pr[1]).toLowerCase().includes(q));
  };
  // 타이핑한 것과 맞는 게 하나도 없으면 거르지 않고 전부 보여줍니다
  const anyHit=[...presets,...mine].some(match);
  const row=v=>{
    const pr=src.find(x=>x[0]===v);
    return `<button type="button" data-cv="${esc(v)}"${v===cur?' style="font-weight:700;background:#EEF5F3"':''}>${
      v===cur?'✓ ':''}${esc(v)}${pr&&LANG!=='ko'?`<small>${esc(t(pr[1]))}</small>`:''}</button>`;
  };
  const sec=(title,vals)=>vals.length?`<div class="chd">${title}</div>`+vals.map(row).join(''):'';
  const[h1,h2]=cfg.head||['catPreset','catMine'];
  pop.innerHTML=sec(t(h1),presets.filter(v=>!anyHit||match(v)))
              +sec(t(h2),mine.filter(v=>!anyHit||match(v)));
  pop.style.minWidth=Math.max(inp.getBoundingClientRect().width,150)+'px';
  pop.classList.add('on');
  comboEl=inp;
  comboPlace();
}
/** 스크롤·리사이즈 때 목록을 닫지 말고 따라 움직이게 합니다.
    (버튼을 누를 때 브라우저가 화면을 살짝 스크롤하는 것만으로 닫히던 문제) */
function comboPlace(){
  if(!comboEl)return;
  const pop=$('comboPop'), r=comboEl.getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight){comboClose();return;}   // 화면 밖으로 나가면 닫습니다
  const h=pop.offsetHeight||0;
  const below=innerHeight-r.bottom;
  pop.style.left=Math.max(6,Math.min(r.left,innerWidth-pop.offsetWidth-6))+'px';
  pop.style.top=(below<h+10&&r.top>h+10?r.top-h-3:r.bottom+3)+'px';   // 아래가 좁으면 위로
}
const comboClose=()=>{$('comboPop').classList.remove('on');comboEl=null;};
document.addEventListener('focusin',e=>{
  const inp=e.target.closest&&e.target.closest('input[data-combo]');
  if(inp)comboOpen(inp);
});
document.addEventListener('click',e=>{
  const inp=e.target.closest('input[data-combo]');
  if(inp){comboOpen(inp);return;}
  if(!e.target.closest('#comboPop'))comboClose();
});
document.addEventListener('input',e=>{
  const inp=e.target.closest('input[data-combo]');
  if(inp&&comboEl===inp)comboOpen(inp,true);   // 타이핑할 때만 걸러냅니다
});
$('comboPop').addEventListener('click',e=>{
  const b=e.target.closest('[data-cv]'); if(!b||!comboEl)return;
  const inp=comboEl;
  inp.value=b.dataset.cv;
  comboClose();
  inp.blur();                                     // 다시 그리기 전에 포커스를 뗍니다
  inp.dispatchEvent(new Event('change',{bubbles:true}));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')comboClose();});
window.addEventListener('scroll',comboPlace,true);
window.addEventListener('resize',comboPlace);

const fixOf=id=>data.fixedCosts.find(c=>String(c.id)===String(id));
$('fixTable').addEventListener('change',async e=>{
  const m=$('exMonth').value;
  const f=e.target.closest('[data-fx]');
  if(f){   // 항목 자체 (이름 · 분류 · 납부일)
    const c=fixOf(f.dataset.id); if(!c)return;
    const k=f.dataset.fx, patch={};
    if(k==='name'){const v=f.value.trim();if(!v){f.value=c.name;return;}c.name=v;patch.name=v;}
    else if(k==='biz'){c.biz=f.value||DEF_BIZ;patch.biz=c.biz;}
    else if(k==='category'){const v=f.value.trim()||'기타';c.category=v;patch.category=v;}
    else if(k==='memo'){c.memo=f.value;patch.memo=c.memo;}
    else if(k==='amount'){
      const v=f.value===''?0:Math.max(0,Number(f.value));
      c.amount=v; patch.amount=v; f.value=v||'';
    }
    else if(k==='dueDay'){
      const v=f.value===''?null:Math.min(31,Math.max(1,Number(f.value)));
      c.dueDay=v; patch.due_day=v; if(v)f.value=v;
    }
    renderEx();
    await op(t('opFix'),()=>sb.from('staff_fixed_costs').update(patch).eq('id',c.id));
    return;
  }
  const p=e.target.closest('[data-fxp]');
  if(p){   // 이 달의 금액 · 납부 여부
    const c=fixOf(p.dataset.id); if(!c)return;
    const key=c.id+'|'+m;
    const cur=data.fixedPays[key]=data.fixedPays[key]||{amount:null,paid:false,date:'',memo:''};
    const k=p.dataset.fxp;
    if(k==='date'){cur.date=p.value;}
    else{cur.amount=p.value===''?null:Number(p.value);}
    renderEx();
    await saveFixedPay(c.id,m,cur);
  }
});

}

  const board=$('warnBoard');

    const list=(data.warnings||[]).filter(w=>w.staff===s.name)
      .sort((a,b)=>b.date.localeCompare(a.date));
    const aw=activeWarnings(s.name), fire=aw>=FIRE_THRESHOLD;
    const pips=[1,2,3].map(n=>`<div class="wpip${n<=aw?' on':''}${n===3?' thr':''}">${n}</div>`).join('');
    const hist=list.length?`<div class="whist">${list.map(w=>{
      const valid=w.level==='서면'&&warnValid(w);
      const lvl=w.level==='서면'?t('wWritten'):t('wVerbal');
      return `<div class="wrow${w.level==='서면'&&!valid?' exp':''}">
        <span class="wd">${w.date}</span>
        <span class="wl" style="color:${w.level==='서면'?'var(--coral)':'var(--amber)'}">${lvl}</span>
        <span>${esc(w.reason||'')}${w.level==='서면'?` <em style="font-style:normal;color:${valid?'var(--jade)':'var(--ink-soft)'}">(${valid?t('wValid'):t('wExpired')})</em>`:''}</span>
        <button class="wx" data-wdel="${w.id}" title="${t('del')}">×</button></div>`;
    }).join('')}</div>`:`<div class="whist" style="color:var(--ink-soft);font-size:12px">${t('warnNone')}</div>`;
    return `<div class="wcard${fire?' fire':''}">
      <div class="wcard-top">
        <b>${esc(s.name)}</b>
        <div class="wpips">${pips}</div>
        <span style="font-size:12px;color:var(--ink-soft)">${aw}/${FIRE_THRESHOLD} ${t('wCountUnit')}</span>
        ${fire?`<span class="fire-badge">${t('fireYes')}</span>`:''}
        <span style="flex:1"></span>

      </div>

  }).join('')||`<div class="empty">${t('addStaffFirst')}</div>`;
}

    s.sched=el.value;
    await pushStaff(s,{sched:s.sched});
  }else{
    const nn=el.value.trim(), old=s.name;
    if(!nn){el.value=old;return;}
    if(data.staff.some((x,j)=>j!==i&&x.name===nn)){alert(t('dupName'));el.value=old;return;}
    // DB 는 staff_id 참조라 이름만 바꾸면 모든 기록이 따라옵니다 (화면도 즉시 동기화)
    const res=await pushStaff(s,{name:nn});
    if(!res.ok){el.value=old;return;}
    data.records.forEach(r=>{if(r.staff===old)r.staff=nn;});
    (data.commissions||[]).forEach(c=>{if(c.staff===old)c.staff=nn;});
    (data.warnings||[]).forEach(w=>{if(w.staff===old)w.staff=nn;});
    [['evals',data.evals],['payroll',data.payroll]].forEach(([,obj])=>{
      Object.keys(obj||{}).forEach(k=>{
        const cut=k.lastIndexOf('|');
        if(k.slice(0,cut)===old){obj[`${nn}|${k.slice(cut+1)}`]=obj[k];delete obj[k];}
      });
    });
    s.name=nn;
  }
  renderStaff(); render();
});

/** staff_members.wage 를 '가장 최근 적용분' 으로 맞춰 둡니다 (백업·표시용) */
async function syncCurrentWage(){
  for(const s of data.staff){
    const h=(data.wageHist[s._id]||[]);
    if(!h.length)continue;
    const last=h[h.length-1];
    if(Number(s.wage||0)!==Number(last.wage)||s.payType!==last.payType){
      s.wage=Number(last.wage); s.payType=last.payType;
      await op(t('opStaff'),()=>sb.from('staff_members')
        .update({wage:s.wage,pay_type:s.payType}).eq('id',s._id));
    }
  }
}

  const res=await op(t('opWage'),()=>sb.from('staff_wage_history')

/* ══════════ 급여 수령증 — 현금으로 드리는 분께 서명을 받습니다 ══════════
   계좌가 없어 현금으로 받는 직원이 있습니다. 통장 기록이 안 남으므로
   받았다는 종이를 남겨 두어야 나중에 말이 달라지지 않습니다.          */
const THNUM=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
const THPOS=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
/** 정수를 태국어로 — 태국 영수증은 금액을 글자로도 적습니다 */
function thInt(n){
  n=Math.floor(Math.abs(Number(n)||0));
  if(n===0)return 'ศูนย์';
  let out='';
  if(n>=1000000){
    out+=thInt(Math.floor(n/1000000))+'ล้าน';
    n=n%1000000;
    if(n===0)return out;
  }
  const str=String(n), L=str.length;
  for(let i=0;i<L;i++){
    const d=+str[i], pos=L-i-1;
    if(d===0)continue;
    if(pos===0&&d===1&&L>1)out+='เอ็ด';        // 끝자리 1 은 '엣'
    else if(pos===1&&d===1){}                  // 십의 자리 1 은 '십' 만
    else if(pos===1&&d===2)out+='ยี่';         // 20 은 '이십' 이 아니라 '이-십'
    else out+=THNUM[d];
    out+=THPOS[pos];
  }
  return out;
}
/** 금액을 태국어 글자로 (BAHTTEXT) */
function bahtText(x){
  const v=Math.round(Number(x||0)*100)/100;
  const neg=v<0, a=Math.abs(v);
  const b=Math.floor(a), st=Math.round((a-b)*100);
  if(b===0&&st===0)return 'ศูนย์บาทถ้วน';
  let out=(b>0?thInt(b):'ศูนย์')+'บาท';
  out+= st>0 ? thInt(st)+'สตางค์' : 'ถ้วน';
  return (neg?'ลบ':'')+out;
}

/* ══════════ 커미션 — 달력 · 날짜별 내역 · 사진 붙여넣기 (관리자) ══════════ */
let cmSel='';                       // 달력에서 고른 날짜 (YYYY-MM-DD)
const cmRate=()=>commRate();        // 자동 커미션과 같은 비율을 씁니다
/** 그 건의 지급액 — 판매금액이 있으면 비율로 계산, 없으면 넣어 둔 금액 그대로 */
/** 직접 넣은 건의 기준금액 (반올림 전).
    예약장부 건과 같은 순서입니다 — 매출보정 → 고와비 수수료 → VAT → 몫 */
const cmBaseRaw=c=>{
  if(c.sale==null)return 0;
  let v=Number(c.sale)*dayFactor(c.date);
  if(c.payKind==='gw')v=Math.round(v*(100-gwRate())/100);
  return exVat(v)*(c.share==null?1:Number(c.share));
};
/** 직접 넣은 건의 기준금액 — 커미션을 매길 금액 */
const cmBaseOf=c=>money2(cmBaseRaw(c));
const cmPayoutOf=c=>{
  if(c.sale==null)return Number(c.amount||0);   // 커미션액을 직접 넣은 건은 그대로
  const r=c.rate==null?cmRate():Number(c.rate);
  return money2(cmBaseRaw(c)*r/100);
};
const cmOfDate=d=>(data.commissions||[]).filter(c=>c.date===d)
  .sort((a,b)=>(a.seq||0)-(b.seq||0));
const cmOfMonth=m=>(data.commissions||[]).filter(c=>(c.date||'').startsWith(m));

const PIKINDS=[['공제','piMinus'],['추가','piPlus']];
const PIREASON={
  '공제':[['무급휴가','piUnpaid'],['지각·결근','piLate'],['가불','piAdvance'],['기타 공제','piEtcM']],
  '추가':[['보너스','piBonus'],['수당','piAllow'],['교통비','piTrans'],['기타 지급','piEtcP']]};
let piWho='';
function buildPiSelects(){
  const k=$('piKind'), v=k.value;
  k.innerHTML=PIKINDS.map(([x,l])=>`<option value="${x}">${t(l)}</option>`).join('');
  k.value=v||'공제';
  $('piReason').placeholder=t('piReasonPh');
  $('piDays').placeholder=t('piDays');
  $('piAmt').placeholder=t('lAmount');
}
function renderPayItems(){
  const m=$('payMonth').value||todayISO().slice(0,7);
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#piList'))ae.blur();
  const live=liveStaff();
  if(!live.some(s=>s.name===piWho))piWho=live.length?live[0].name:'';
  $('piWho').innerHTML=live.map(s=>`<button type="button" class="wchip${
    piWho===s.name?' on':''}" data-piwho="${esc(s.name)}">${esc(s.name)}</button>`).join('')
    ||`<span style="font-size:12px;color:var(--ink-soft)">${t('addStaffFirst')}</span>`;
  const rows=(data.payItems||[]).filter(x=>x.month===m)
    .sort((a,b)=>a.staff.localeCompare(b.staff)||(a.seq||0)-(b.seq||0));
  const addT=money2(rows.filter(x=>x.kind==='추가').reduce((a,x)=>a+x.amount,0));
  const subT=money2(rows.filter(x=>x.kind==='공제').reduce((a,x)=>a+x.amount,0));
  $('piList').innerHTML=rows.length?`<div style="overflow-x:auto"><table>
    <thead><tr><th style="width:18%">${t('cStaff')}</th>
      <th style="width:10%">${t('piKind')}</th>
      <th>${t('lReason')}</th>
      <th class="num" style="width:11%">${t('piDays')}</th>
      <th class="num" style="width:16%">${t('lAmount')}</th>
      <th style="width:38px"></th></tr></thead>
    <tbody>${rows.map(x=>`<tr>
      <td><b>${esc(x.staff)}</b></td>
      <td><span class="pikind ${x.kind==='추가'?'plus':'minus'}">${x.kind==='추가'?'＋':'−'} ${esc(x.kind)}</span></td>
      <td><input type="text" data-pi="reason" data-id="${x.id}" value="${esc(x.reason)}"
        placeholder="${t('piReasonPh')}" style="width:100%"></td>
      <td><input type="number" step="0.5" min="0" data-pi="days" data-id="${x.id}"
        value="${x.days==null?'':x.days}" placeholder="—"
        style="width:100%;text-align:right;font-family:'IBM Plex Mono',monospace"></td>
      <td><input type="number" step="1" min="0" data-pi="amount" data-id="${x.id}"
        value="${x.amount}" style="width:100%;text-align:right;font-weight:700;
        font-family:'IBM Plex Mono',monospace;color:${x.kind==='추가'?'var(--jade)':'var(--coral)'}"></td>
      <td style="text-align:right"><button class="del" data-pidel="${x.id}">×</button></td></tr>`).join('')}</tbody>
    <tfoot><tr>
      <th colspan="4" style="text-align:right;border-top:1px solid var(--ink);border-bottom:none">
        ${t('piPlus')} ${money(addT)} · ${t('piMinus')} ${money(subT)}</th>
      <th class="num" style="border-top:1px solid var(--ink);border-bottom:none;font-family:'IBM Plex Mono',monospace;font-size:14px">${money(money2(addT-subT))}</th>
      <th style="border-top:1px solid var(--ink);border-bottom:none"></th></tr></tfoot></table></div>`
    :`<div class="empty">${t('piNone')}</div>`;
}
/* 담당 직원 고르기 */
$('piWho').addEventListener('click',e=>{
  const b=e.target.closest('[data-piwho]'); if(!b)return;
  piWho=b.dataset.piwho; renderPayItems(); $('piAmt').focus();
});
/* 무급휴가 일수를 넣으면 금액을 자동으로 채웁니다 */
$('piDays').addEventListener('input',()=>{
  const d=Number($('piDays').value||0);
  if(!d||$('piKind').value!=='공제')return;
  const s=data.staff.find(x=>x.name===piWho); if(!s)return;
  const m=$('payMonth').value||todayISO().slice(0,7);
  const dw=dailyWage(s,m);
  if(dw)$('piAmt').value=money2(d*dw);
});
$('piKind').addEventListener('change',()=>{comboClose();});
$('piAdd').addEventListener('click',async()=>{
  const amt=Number($('piAmt').value||0);
  if(!amt){$('piAmt').focus();return;}
  if(!piWho){bkSay(t('addStaffFirst'),'var(--coral)');return;}
  const m=$('payMonth').value||todayISO().slice(0,7);
  const row={staff_id:sidOf(piWho),month:m,kind:$('piKind').value||'공제',
    reason:$('piReason').value.trim(),amount:amt,
    days:$('piDays').value===''?null:Number($('piDays').value),date:null};
  const res=await op(t('opPayItem'),()=>sb.from('staff_pay_items').insert(row).select().single());
  if(!res.ok){ bkSay(t('piSaveFail'),'var(--coral)'); return; }   // 칸을 비우지 않습니다
  if(res.data)data.payItems.push({id:res.data.id,_sid:row.staff_id,staff:piWho,
    month:m,kind:row.kind,reason:row.reason,amount:amt,days:row.days,date:'',seq:Date.now()});
  $('piAmt').value=''; $('piDays').value=''; $('piReason').value='';
  renderPayItems(); renderPay();
  $('piAmt').focus();
});
['piReason','piDays','piAmt'].forEach(id=>
  $(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('piAdd').click();}}));
$('piList').addEventListener('change',async e=>{
  const el=e.target.closest('[data-pi]'); if(!el)return;
  const x=(data.payItems||[]).find(y=>String(y.id)===String(el.dataset.id)); if(!x)return;
  const k=el.dataset.pi, patch={};
  if(k==='reason'){x.reason=el.value;patch.reason=x.reason;}
  else if(k==='days'){x.days=el.value===''?null:Number(el.value);patch.days=x.days;}
  else{x.amount=Math.max(0,Number(el.value||0));patch.amount=x.amount;}
  renderPayItems(); renderPay();
  await op(t('opPayItem'),()=>sb.from('staff_pay_items').update(patch).eq('id',x.id));
});
$('piList').addEventListener('click',async e=>{
  const b=e.target.closest('[data-pidel]'); if(!b)return;
  if(!confirm(t('confirmDel')))return;
  const id=b.dataset.pidel;
  data.payItems=(data.payItems||[]).filter(x=>String(x.id)!==String(id));
  renderPayItems(); renderPay();
  await op(t('opPayItem')+' · '+t('opDel'),()=>sb.from('staff_pay_items').delete().eq('id',id));
});

function renderComm(){
  renderPayItems();
  renderBkComm();
  // 표 안에 포커스가 남은 채로 갈아끼우면 크롬이 예외를 던집니다
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#cmDay'))ae.blur();
  const m=$('payMonth').value||todayISO().slice(0,7);
  if(document.activeElement!==$('cmRate'))$('cmRate').value=cmRate();
  if(!cmSel||!cmSel.startsWith(m))cmSel=m+'-'+pad(Math.min(new Date().getDate(),daysInMonth(m)));
  const list=cmOfMonth(m);
  const total=money2(list.reduce((a,c)=>a+cmPayoutOf(c),0));
  const sale=list.reduce((a,c)=>a+Number(c.sale||0),0);
  $('cmStat').innerHTML=`${t('commTotal')} <b>${money(total)}</b>`
    +(sale?`<span style="font-weight:400;color:var(--ink-soft);font-size:11px"> · ${t('cmSaleSum')} ${money(sale)}</span>`:'');

  /* ── 달력 ── */
  const [Y,MM]=m.split('-').map(Number);
  const first=new Date(Y,MM-1,1).getDay(), dim=daysInMonth(m);
  const byDay={};
  list.forEach(c=>{const d=c.date;(byDay[d]=byDay[d]||{n:0,v:0,who:new Set()});
    byDay[d].n++; byDay[d].v+=cmPayoutOf(c); byDay[d].who.add(c.staff);});
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cmcell out"></div>`;
  for(let d=1;d<=dim;d++){
    const iso=m+'-'+pad(d), x=byDay[iso], w=new Date(Y,MM-1,d).getDay();
    cells+=`<div class="cmcell${x?' has':''}${cmSel===iso?' sel':''}${w===0?' su':w===6?' sa':''}"
      data-cmday="${iso}" role="button" tabindex="0">
      <span class="d">${d}</span>
      ${x?`<span class="v">${money(money2(x.v))}</span><span class="n">${x.n}${t('cntRec')}</span>`:''}
    </div>`;
  }
  $('cmCal').innerHTML=`<div class="cmcal">
    <div class="cmhead">${DOW[LANG].map((w,i)=>
      `<div class="${i===0?'su':i===6?'sa':''}">${w}</div>`).join('')}</div>
    <div class="cmgrid">${cells}</div></div>`;

  /* ── 고른 날짜의 내역 ── */
  const day=cmOfDate(cmSel);
  const dTot=money2(day.reduce((a,c)=>a+cmPayoutOf(c),0));
  $('cmDay').innerHTML=`<div class="cmdayhd">
      <b>${cmSel}</b> <span>${day.length}${t('cntRec')} · ${money(dTot)}</span></div>`
    +(day.length?`<div style="overflow-x:auto"><table>
      <thead><tr>
        <th style="width:20%">${t('cStaff')}</th>
        <th>${t('lReason')}</th>
        <th class="num" style="width:15%">${t('cmSale')}</th>
        <th class="num" style="width:9%">%</th>
        <th class="num" style="width:15%">${t('cmPayout')}</th>
        <th style="width:38px"></th></tr></thead>
      <tbody>${day.map(c=>`<tr>
        <td><b>${esc(c.staff)}</b>${c.share!=null&&c.share!==1
          ?`<br><span class="cmshare">${Math.round(c.share*100)}%</span>`:''}</td>
        <td><input type="text" data-cm="memo" data-id="${c.id}" value="${esc(c.memo||'')}"
          placeholder="${t('memoPhShort')}" style="width:100%"></td>
        <td><input type="number" step="10" min="0" data-cm="sale" data-id="${c.id}"
          value="${c.sale==null?'':c.sale}" placeholder="—"
          style="width:100%;text-align:right;font-family:'IBM Plex Mono',monospace"></td>
        <td class="num" style="font-size:11.5px;color:var(--ink-soft)">${
          c.sale==null?'—':(c.rate==null?cmRate():c.rate)+'%'}</td>
        <td><input type="number" step="1" min="0" data-cm="amount" data-id="${c.id}"
          value="${c.sale==null?c.amount:''}" placeholder="${c.sale==null?'':cmPayoutOf(c)}"
          title="${t('cmPayoutHint')}"
          style="width:100%;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:700"></td>
        <td style="text-align:right"><button class="del" data-cmdel="${c.id}">×</button></td></tr>`).join('')}</tbody>
      </table></div>`
    :`<div class="empty">${t('cmDayNone')}</div>`);

  /* ── 이 달 전체 목록 (직원별 합계) ── */
  const per=new Map();
  list.forEach(c=>{const k=c.staff;const cur=per.get(k)||{n:0,v:0};cur.n++;cur.v+=cmPayoutOf(c);per.set(k,cur);});
  renderQuick();
  $('cmList').innerHTML=per.size?`<div style="overflow-x:auto"><table>
    <thead><tr><th style="width:34%">${t('cStaff')}</th>
      <th class="num" style="width:22%">${t('bcCount')}</th>
      <th class="num" style="width:44%">${t('commTotal')}</th></tr></thead>
    <tbody>${[...per.entries()].sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>`<tr>
      <td><b>${esc(k)}</b></td><td class="num">${v.n}${t('cntRec')}</td>
      <td class="num"><b class="pay-est">${money(money2(v.v))}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr>
      <th style="border-top:1px solid var(--ink);border-bottom:none">${t('payTotalRow')}</th>
      <th class="num" style="border-top:1px solid var(--ink);border-bottom:none">${list.length}${t('cntRec')}</th>
      <th class="num" style="border-top:1px solid var(--ink);border-bottom:none;font-family:'IBM Plex Mono',monospace;font-size:14px">${money(total)}</th>
    </tr></tfoot></table></div>`
    :`<div class="empty">${t('commNone')}</div>`;
}
