/* 비율을 바꿔도 이미 넣어 둔 건은 그때 적용한 비율을 그대로 씁니다
   (지난달 급여가 나중에 바뀌면 안 되니까요). 이 달 것만 다시 계산하려면 이 버튼. */
$('cmReapply').addEventListener('click',async()=>{
  const m=$('payMonth').value||todayISO().slice(0,7);
  const rate=cmRate();
  const targets=cmOfMonth(m).filter(c=>c.sale!=null&&c.rate!==rate);
  if(!targets.length){bkSay(t('cmReapplyNone'),'var(--ink-soft)');return;}
  if(!confirm(`${m} · ${targets.length}${t('cntRec')}\n\n${t('cmReapplyAsk')} ${rate}%`))return;
  for(const c of targets){
    c.rate=rate; c.amount=cmPayoutOf(c);
    const r=await op(t('opComm'),()=>sb.from('staff_commissions')
      .update({rate,amount:c.amount}).eq('id',c.id));
    if(!r.ok)break;
  }
  renderComm(); renderPay();
  bkSay(`✓ ${targets.length}${t('cntRec')} · ${rate}%`,'var(--jade)');
});
/* 날짜별 내역 직접 고치기 */
$('cmDay').addEventListener('change',async e=>{
  const el=e.target.closest('[data-cm]'); if(!el)return;
  const c=(data.commissions||[]).find(x=>String(x.id)===String(el.dataset.id)); if(!c)return;
  const k=el.dataset.cm, raw=el.value.trim();
  const patch={};
  if(k==='memo'){c.memo=el.value;patch.memo=c.memo;}
  else if(k==='sale'){
    c.sale=raw===''?null:Math.max(0,Number(raw));
    patch.sale_amount=c.sale;
    if(c.sale!=null){ if(c.rate==null)c.rate=cmRate(), patch.rate=c.rate;
                      c.amount=cmPayoutOf(c); patch.amount=c.amount; }
  }
  else if(k==='amount'){
    if(raw===''){ if(c.sale!=null){c.amount=cmPayoutOf(c);patch.amount=c.amount;} }
    else { c.amount=Math.max(0,Number(raw)); patch.amount=c.amount;
           c.sale=null; c.rate=null; patch.sale_amount=null; patch.rate=null; }
  }
  renderComm(); renderPay();
  await op(t('opComm'),()=>sb.from('staff_commissions').update(patch).eq('id',c.id));
});

/* ══════════ 빠른 하루치 입력 ══════════
   담당자를 한 번 누르고 금액만 치면 Enter 로 한 줄이 들어갑니다.
   담당자와 날짜는 그대로 남아 있어서 같은 사람 건을 연달아 넣기 좋습니다. */
let cmWho=[];                       // 지금 고른 담당자 이름들
function renderQuick(){
  const day=cmOfDate(cmSel);
  const tot=money2(day.reduce((a,c)=>a+cmPayoutOf(c),0));
  if(document.activeElement!==$('cmQDate'))$('cmQDate').value=cmSel;
  $('cmQSum').innerHTML=`<b>${day.length}</b>${t('cntRec')} · <b>${money(tot)}</b>`;
  const live=liveStaff();
  cmWho=cmWho.filter(n=>live.some(s=>s.name===n));
  $('cmQWho').innerHTML=live.map(s=>`<button type="button" class="wchip${
    cmWho.includes(s.name)?' on':''}" data-who="${esc(s.name)}">${esc(s.name)}</button>`).join('')
    ||`<span style="font-size:12px;color:var(--ink-soft)">${t('addStaffFirst')}</span>`;
  qCalc();
}
/** 금액을 치는 동안 커미션이 얼마인지 바로 보여 줍니다 */
function qCalc(){
  const v=Number($('cmQAmt').value||0);
  const n=cmWho.length;
  if(!v||!n){$('cmQCalc').textContent='—';$('cmQCalc').classList.remove('on');return;}
  const each=money2(exVat(v)*cmRate()/100/n);
  $('cmQCalc').textContent=n>1?`${money(each)} × ${n}`:money(each);
  $('cmQCalc').classList.add('on');
}
$('cmQAmt').addEventListener('input',qCalc);
$('cmQWho').addEventListener('click',e=>{
  const b=e.target.closest('[data-who]'); if(!b)return;
  const n=b.dataset.who;
  cmWho.includes(n)?cmWho=cmWho.filter(x=>x!==n):cmWho.push(n);
  renderQuick();
  $('cmQAmt').focus();
});
const qShift=d=>{
  const dt=new Date(cmSel+'T00:00'); dt.setDate(dt.getDate()+d);
  cmSel=dt.toISOString().slice(0,10);
  renderComm(); $('cmQAmt').focus();
};
$('cmQPrev').addEventListener('click',()=>qShift(-1));
$('cmQNext').addEventListener('click',()=>qShift(1));
$('cmQToday').addEventListener('click',()=>{
  cmSel=todayISO();
  $('payMonth').value=cmSel.slice(0,7);
  renderPay(); renderComm(); $('cmQAmt').focus();
});
$('cmQDate').addEventListener('change',()=>{
  const v=$('cmQDate').value; if(!v)return;
  cmSel=v; $('payMonth').value=v.slice(0,7);
  renderPay(); renderComm();
});
async function quickAdd(){
  const v=Number($('cmQAmt').value||0);
  if(!v){$('cmQAmt').focus();return;}
  if(!cmWho.length){bkSay(t('cmQNeedWho'),'var(--coral)');return;}
  const rate=cmRate(), n=cmWho.length, share=money2(1/n);
  const memo=$('cmQMemo').value.trim();
  const rows=cmWho.map(name=>({staff_id:sidOf(name),date:cmSel,
    amount:money2(exVat(v)*rate/100/n),memo,sale_amount:v,rate,share,src:'quick',
    legacy_id:newLid('cm'),_name:name}));
  // 화면에는 먼저 넣고 (기다리지 않게), 저장은 뒤에서 합니다
  $('cmQAmt').value=''; $('cmQMemo').value='';
  $('cmQAmt').focus();
  const res=await op(t('opComm'),()=>sb.from('staff_commissions')
    .insert(rows.map(({_name,...x})=>x)).select());
  if(res.ok&&res.data)(res.data||[]).forEach((d,i)=>data.commissions.push({
    id:d.id,_sid:d.staff_id,staff:rows[i]._name,date:d.date,
    amount:Number(d.amount||0),memo:d.memo||'',lid:d.legacy_id||null,
    sale:d.sale_amount==null?null:Number(d.sale_amount),
    rate:d.rate==null?null:Number(d.rate),
    share:d.share==null?null:Number(d.share),src:'quick',seq:Date.now()+i}));
  bcOpenDay(cmSel);                  // 위 예약 목록에서 바로 보이게 그날을 펼칩니다
  renderComm(); renderPay();
  $('cmQAmt').focus();
}
$('cmQAdd').addEventListener('click',quickAdd);
$('cmQAmt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();quickAdd();}});
$('cmQMemo').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('cmQAmt').focus();}});

/* ══════════ 사진 → 텍스트 붙여넣기로 한 번에 넣기 ══════════
   종이 기록을 찍어 글자로 옮긴 것을 그대로 붙여넣습니다.
   한 줄 = 한 건. 칸은 탭 · 쉼표 · 세로줄(|) · 공백 두 칸 이상으로 나눕니다.
     날짜   고객·시술            판매금액   담당자
     16     나오아 HIFU 8000     1890      Bew
     09-17  마페 배+팔           5094      Bew, Muay
   날짜는 '일' 만 써도 되고 (위 달력의 달을 씁니다), 담당자는 여러 명이면 쉼표로.
   숫자와 담당자는 자리가 바뀌어 있어도 알아서 찾습니다.                        */
let cmPasteRows=[];
/** 직원 이름 · 줄임말로 우리 직원 찾기 (예약장부 이름 잇기도 같이 씁니다) */
function cmFindStaff(tok){
  const s=String(tok||'').trim(); if(!s)return null;
  return staffOfBkName(s)||autoMatch(s)||null;
}
const cmNum=s=>{
  const x=String(s||'').replace(/[,\s฿]/g,'');
  return /^\d+(\.\d+)?$/.test(x)?Number(x):null;
};
/** 한 줄을 날짜 · 금액 · 담당자 · 내용으로 나눕니다 */
function cmParseLine(line,month){
  const raw=line.replace(/ /g,' ').trim();
  if(!raw)return null;
  const cells=raw.split(/\t+|\s*\|\s*|\s*;\s*|,(?=\s)|\s{2,}/).map(x=>x.trim()).filter(x=>x!=='');
  if(cells.length<2)return null;
  let date=null,amount=null,names=[],rest=[];
  const dim=daysInMonth(month);
  cells.forEach((cell,i)=>{
    const c=cell.trim();
    // 날짜 — 2026-09-16 / 09-16 / 16 (맨 앞 칸일 때만 '일' 로 인정)
    if(date==null){
      let mm;
      if((mm=c.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/)))
        { date=`${mm[1]}-${pad(+mm[2])}-${pad(+mm[3])}`; return; }
      if((mm=c.match(/^(\d{1,2})[-./](\d{1,2})$/)))
        { date=`${month.slice(0,4)}-${pad(+mm[1])}-${pad(+mm[2])}`; return; }
      if(i===0&&(mm=c.match(/^(\d{1,2})$/))&&+mm[1]>=1&&+mm[1]<=dim)
        { date=`${month}-${pad(+mm[1])}`; return; }
    }
    // 담당자 — 쉼표/슬래시로 여러 명
    const parts=c.split(/[,/·+]/).map(x=>x.trim()).filter(Boolean);
    if(parts.length&&parts.every(x=>cmFindStaff(x))){
      parts.forEach(x=>{const s=cmFindStaff(x);if(s&&!names.includes(s.name))names.push(s.name);});
      return;
    }
    // 금액 — 숫자만 있는 칸 중 가장 큰 것
    const n=cmNum(c);
    if(n!=null){ if(amount==null||n>amount)amount=n; return; }
    rest.push(c);
  });
  if(date==null)date=month+'-'+pad(1);
  return {date,amount,names,memo:rest.join(' ').trim(),raw};
}
function cmParseAll(text,month){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(l=>{
    const r=cmParseLine(l,month);
    if(r&&(r.amount!=null||r.names.length))out.push(r);
  });
  return out;
}

        <span class="bcamt">${money(cmPayoutOf(c))}</span></div></td></tr>`).join('');
    return head+manRows+day.map(b=>{
      const shares=commShares(b), gw=isGowabi(b);
      const treat=((Array.isArray(b.items)&&b.items.length
        ? b.items.map(it=>it.treat).filter(Boolean).join(' + ') : (b.treat||''))||'—');
      const ovr=(data.commOvr||{})[b.id]||{};
      const skipped=bkSkipped(b), isDup=dups.has(b.id);
      /* 같은 날 같은 번호 — 한 손님이 이어서 받은 시술이라 묶어서 보여 줍니다 */
      const g=dg.meta.get(b.id)||{n:1,first:true,last:true,sum:0};
      const gc=g.n>1?` grp${g.first?' gfirst':''}${g.last?' glast':''}`:'';

        <td class="bcbtns">
          <button class="bcchk${chk?' on':''}" data-bcchk="${b.id}"

          <button class="bcskip${skipped?' on':''}" data-bcskipbk="${b.id}"

        <td>

                data-id="${b.id}" value="${esc(it.treat||'')}"
                placeholder="${t('bcTreat')}" title="${t('bcTreatHint')}">`).join('')
            : `<input type="text" class="bcedit tr" data-bktreat="-" data-id="${b.id}"

                title="${t('bcTreatHint')}">`)}
          <select class="paysel${ovr.payKind?' on':''}${gw?' gw':''}" data-bcpay="${b.id}"
              title="${t('bcPayHint')}">
            <option value=""${ovr.payKind?'':' selected'}>${t('bcPayAuto')} · ${
              bkPayAuto(b)==='gw'?'GoWabi':t('bcPayOn')}</option>
            <option value="gw"${ovr.payKind==='gw'?' selected':''}>GoWabi −${gwRate()}%</option>
            <option value="on"${ovr.payKind==='on'?' selected':''}>${t('bcPayOn')}</option>
          </select></td>
        <td class="num" style="font-size:11px;color:var(--ink-soft)">${money(bkGross(b))}</td>
        <td><input type="number" step="1" min="0" data-bcovr="${b.id}"
            value="${ovr.amount==null?'':ovr.amount}" placeholder="—"

            style="width:100%;text-align:right;font-family:'IBM Plex Mono',monospace;padding:5px 7px;font-size:12px${
            bkEdited(b)?';background:#FBF4E3;font-weight:700':''}"></td>
        <td class="num" style="font-family:'IBM Plex Mono',monospace;font-size:12px">${money(Math.round(commBase(b)))}</td>
        <td>${shares.map(sh=>{
            const s=staffOfBkName(sh.name);
            return `<div class="bcsh${s?'':' bad'}">
              <button class="bcshx" data-bkstaffdel="${esc(sh.name)}" data-id="${b.id}"
                title="${t('bcStaffDel')}">×</button>
              <span class="bkname">${esc(sh.name)}</span>
              ${s&&s.name!==sh.name?`<span class="mapped">→ ${esc(s.name)}</span>`:''}
              ${shares.length>1?`<input type="number" step="1" min="0" data-bcsplit="${b.id}"
                 data-bn="${esc(sh.name)}" value="${sh.custom?sh.weight:''}"
                 placeholder="${Math.round(sh.share*100)}" title="${t('bcSplitHint')}"
                 class="bcw${sh.custom?' on':''}">`:''}
              <span class="bcamt">${money(money2(sh.comm))}</span></div>`;
          }).join('')}
          ${shares.length?'':`<div style="color:var(--coral);font-size:11px">${t('bcNoStaff')}</div>`}
          <select class="bcaddwho" data-bkstaffadd="${b.id}" title="${t('bcStaffAddHint')}">
            <option value="">+ ${t('bcStaffAdd')}</option>
            ${whoOpts(bkNames(b)).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
          </select></td>
      </tr>`;
    }).join('')+addRow;
  }).join('');
  $('bcList').innerHTML=`<div class="bctools no-print">
      <button class="ghost" id="bcOpenAll">${t('bcExpand')}</button>
      <button class="ghost" id="bcShutAll">${t('bcCollapse')}</button>
      <button class="ghost" id="bcAddManual">${t('bcAddBtn')}</button>
      ${fixTodo.length?`<button class="ghost" id="bcFixAll">${t('bcFixAll')} ${fixTodo.length}</button>`:''}
      <span class="bchint">${t('bcClickDay')}</span></div>
    <div style="overflow-x:auto"><table class="bctab">
    <thead><tr>
      <th style="width:44px"></th>
      <th style="width:15%">${t('lDate')} · ${t('bcCustomer')}</th>
      <th style="width:22%">${t('bcTreat')}</th>
      <th class="num" style="width:10%">${t('bcBooked')}</th>
      <th class="num" style="width:11%">${t('bcActual')}</th>
      <th class="num" style="width:11%">${t('bcBase')}</th>
      <th style="width:26%">${t('bcStaffShare')}</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
  $('bcOpenAll').onclick=()=>{bcOpen=new Set(dates);renderBkComm();};
  if($('bcFixAll'))$('bcFixAll').onclick=async()=>{
    if(!confirm(t('bcFixAllAsk').replace('{n}',fixTodo.length)))return;
    $('bcFixAll').disabled=true;
    data.commDisc=data.commDisc||{};
    fixTodo.forEach(d=>{const gap=dayGap(d);if(gap!=null&&gap<0)data.commDisc[d]=Math.round(-gap);});
    renderPay(); renderBkComm();
    for(const d of fixTodo)await saveCommDay(d);
  };
  $('bcShutAll').onclick=()=>{bcOpen=new Set();renderBkComm();};
  /* 예약장부에 없는 건은 아래 커미션 내역에서 직접 넣습니다 */
  $('bcAddManual').onclick=()=>{
    const st=(data.commCfg||{}).startDate||'';
    cmSel=(st&&st.startsWith(m))?st:(dates[dates.length-1]||m+'-01');
    renderComm();
    const el=document.querySelector('[data-i="commTitle"]');
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(()=>$('cmQAmt').focus(),400);
  };
}
/* 넣는 줄에 치던 내용 — 표를 다시 그려도 날아가지 않게 따로 들고 있습니다.
   실시간 동기화나 다른 저장 때문에 표가 수시로 다시 그려지는데,
   그때 고른 담당자와 치던 금액이 사라져 '추가' 를 눌러도 아무 일이 없었습니다. */
const bcAddBuf={};
const bcBuf=d=>bcAddBuf[d]||(bcAddBuf[d]={who:[],gw:false,memo:'',amt:''});
let bcAddBusy=false;                    // 두 번 눌려 두 줄이 들어가는 것을 막습니다
/** 예약장부에 없는 건을 그 날짜에 바로 넣습니다 (위 목록 안에서) */
async function bcAddGo(d){
  if(bcAddBusy)return;
  const bf=bcBuf(d);
  const amtEl=document.querySelector(`.bcaddamt[data-d="${d}"]`);
  const memoEl=document.querySelector(`.bcaddmemo[data-d="${d}"]`);
  /* 화면에 지금 있는 값이 가장 최신입니다 (다시 그려졌으면 기억해 둔 값) */
  if(amtEl)bf.amt=amtEl.value;
  if(memoEl)bf.memo=memoEl.value;
  const who=bf.who.filter(n=>liveStaff().some(s=>s.name===n));
  const v=Math.max(0,Number(bf.amt||0));
  if(!who.length){bkSay(t('bcAddNoWho'));bcAddWarn(d);return;}
  if(!v){bkSay(t('bcAddNoAmt'));bcAddWarn(d);if(amtEl)amtEl.focus();return;}
  const rate=commRate(), n=who.length, share=money2(1/n);
  const memo=String(bf.memo||'').trim();
  const pk=bf.gw?'gw':null;
  const rows=who.map(name=>({staff_id:sidOf(name),date:d,
    amount:cmPayoutOf({sale:v,rate,share,date:d,payKind:pk}),
    memo,sale_amount:v,rate,share,src:'row',pay_kind:pk,
    legacy_id:newLid('cm'),_name:name}));
  bcAddBusy=true;
  const send=rows.map(({_name,...x})=>x);
  let res=await op(t('opComm'),()=>sb.from('staff_commissions').insert(send).select());
  /* pay_kind 칸을 아직 안 만든 곳에서도 넣는 것 자체는 되게 합니다 */
  if(!res.ok&&pk==null)
    res=await op(t('opComm'),()=>sb.from('staff_commissions')
      .insert(send.map(({pay_kind,...x})=>x)).select());
  bcAddBusy=false;
  if(!res.ok){bcAddWarn(d);return;}      // 친 내용은 그대로 둡니다 — 다시 누르면 됩니다
  (res.data||[]).forEach((x,i)=>data.commissions.push({
    id:x.id,_sid:x.staff_id,staff:rows[i]._name,date:x.date,
    amount:Number(x.amount||0),memo:x.memo||'',lid:x.legacy_id||null,
    sale:x.sale_amount==null?null:Number(x.sale_amount),
    rate:x.rate==null?null:Number(x.rate),
    share:x.share==null?null:Number(x.share),src:'row',
    payKind:x.pay_kind||'',seq:Date.now()+i}));
  bf.amt=''; bf.memo='';                // 담당자와 고와비는 두어 연달아 넣기 좋게
  bcOpenDay(d);
  renderComm(); renderPay();
  const a2=document.querySelector(`.bcaddamt[data-d="${d}"]`); if(a2)a2.focus();
}
/** 안 들어갔을 때 그 줄을 잠깐 빨갛게 — 눌렀는데 아무 일이 없어 보이지 않게 */
function bcAddWarn(d){
  const el=document.querySelector(`[data-bcaddgo="${d}"]`);
  if(!el)return;
  const box=el.closest('.bcadd'); if(!box)return;
  box.classList.remove('warn'); void box.offsetWidth; box.classList.add('warn');
  setTimeout(()=>box.classList.remove('warn'),1400);
}
/* 날짜 줄을 눌러 그날 건들을 펼치고 접습니다 */
let bcOpen=null;
/** 그날을 펼쳐 둡니다 — 직접 넣은 건이 바로 보이게 */
function bcOpenDay(d){
  if(!d)return;
  if(bcOpen===null)bcOpen=new Set();
  bcOpen.add(d);
}
function bcToggle(d){
  if(bcOpen===null)bcOpen=new Set();
  bcOpen.has(d)?bcOpen.delete(d):bcOpen.add(d);
  renderBkComm();
}
$('bcList').addEventListener('click',async e=>{
  /* 입력칸을 누른 것은 날짜를 접거나 펴는 뜻이 아닙니다 */
  if(e.target.closest('input,select,textarea'))return;
  /* 부킹시트 확정액에 맞춰 그날 보정을 넣습니다 */
  const fx=e.target.closest('[data-bcfix]');
  if(fx){
    e.stopPropagation();
    const d=fx.dataset.bcfix, v=Math.max(0,Math.round(Number(fx.dataset.v||0)));
    data.commDisc=data.commDisc||{};
    v>0?data.commDisc[d]=v:delete data.commDisc[d];
    renderPay(); renderBkComm();
    await saveCommDay(d);
    return;
  }
  /* 그날 커미션 지급 여부 스위치 (날짜 펼치기보다 먼저 봅니다) */
  const sk=e.target.closest('[data-bcskip]');
  if(sk){
    e.stopPropagation();
    const d=sk.dataset.bcskip;
    data.commSkip=data.commSkip||new Set();
    const nowOn=commDayOn(d);
    const st=(data.commCfg||{}).startDate||'';
    const dc=dayDisc(d);
    if(nowOn){
      data.commSkip.add(d);
      renderPay(); renderBkComm();
      await saveCommDay(d);
    }else{
      data.commSkip.delete(d);
      // 시작일 때문에 꺼져 있던 날이면 시작일을 그 날로 당겨 줍니다
      if(st&&d<st){ data.commCfg.startDate=d;
        await op(t('opComm'),()=>sb.from('staff_comm_config')
          .upsert({id:1,start_date:d},{onConflict:'id'})); }
      renderPay(); renderBkComm();
      // 보정이 걸린 날이면 줄을 지우지 않고 '커미션 줌' 으로만 바꿉니다
      dc>0?await saveCommDay(d):await op(t('opComm'),
        ()=>sb.from('staff_comm_skip').delete().eq('day',d));
    }
    return;
  }
  /* 넣을 담당자 고르기 — 다시 그리면 치던 글자가 날아가므로 표시만 바꿉니다 */
  const agw=e.target.closest('[data-bcawgw]');
  if(agw){ e.stopPropagation();
    const d=agw.dataset.bcawgw, bf=bcBuf(d);
    bf.gw=!bf.gw; agw.classList.toggle('on',bf.gw);
    const a3=document.querySelector(`.bcaddamt[data-d="${d}"]`);
    if(a3)a3.focus();
    return; }
  const aw=e.target.closest('[data-bcaw]');
  if(aw){ e.stopPropagation();
    const d=aw.dataset.d, n=aw.dataset.bcaw, bf=bcBuf(d);
    bf.who=bf.who.includes(n)?bf.who.filter(x=>x!==n):bf.who.concat(n);
    aw.classList.toggle('on',bf.who.includes(n));
    const amt=document.querySelector(`.bcaddamt[data-d="${d}"]`);
    if(amt)amt.focus();
    return; }
  /* 이 날짜에 건 넣기 */
  const ag=e.target.closest('[data-bcaddgo]');
  if(ag){ e.stopPropagation(); await bcAddGo(ag.dataset.bcaddgo); return; }
  /* 담당자 빼기 — 예약장부의 담당자 칸이 같이 바뀝니다 */
  const sd=e.target.closest('[data-bkstaffdel]');
  if(sd){
    e.stopPropagation();
    const b=(data.bookings||[]).find(x=>String(x.id)===String(sd.dataset.id)); if(!b)return;
    const gone=sd.dataset.bkstaffdel;
    const left=bkNames(b).filter(n=>n!==gone);
    delete data.commSplit[b.id+'|'+gone];
    renderPay(); renderBkComm();
    await saveBookingField(b,{staff:left.join(', ')});
    await op(t('opComm'),()=>sb.from('staff_comm_split').delete()
      .eq('booking_id',b.id).eq('booking_name',gone));
    return;
  }
  /* 직접 넣은 건 지우기 */
  const md=e.target.closest('[data-bccmdel]');
  if(md){
    e.stopPropagation();
    if(!confirm(t('confirmDel')))return;
    const id=md.dataset.bccmdel;
    data.commissions=(data.commissions||[]).filter(c=>String(c.id)!==String(id));
    renderComm(); renderPay();
    await op(t('opComm')+' · '+t('opDel'),()=>sb.from('staff_commissions').delete().eq('id',id));
    return;
  }
  /* 직접 넣은 건 고치기 — 아래 커미션 내역의 그 날짜로 데려갑니다 */
  const me=e.target.closest('[data-bcmanedit]');
  if(me){
    e.stopPropagation();
    cmSel=me.dataset.bcmanedit;
    renderComm();
    const el=document.querySelector('[data-i="commTitle"]');
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  /* 금액 확인 — 포스 · 종이와 맞춰 본 건에 표시 */
  const ck=e.target.closest('[data-bcchk]');
  if(ck){
    e.stopPropagation();
    const id=ck.dataset.bcchk;
    const cur=data.commOvr[id]||{amount:null,memo:'',skip:false,skipWhy:'',checked:false};
    cur.checked=!cur.checked;
    cur.checkedAt=cur.checked?new Date().toISOString():'';
    data.commOvr[id]=cur;
    renderBkComm();
    await saveOvr(id);
    return;
  }
  /* 하루치를 한꺼번에 확인 — 다 됐으면 전부 풉니다 */
  const ckd=e.target.closest('[data-bcchkday]');
  if(ckd){
    e.stopPropagation();
    const d=ckd.dataset.bcchkday;
    const day=(data.bookings||[]).filter(b=>b.status==='방문'&&b.date===d);
    if(!day.length)return;
    const on=!day.every(bkChecked);
    const now=new Date().toISOString();
    day.forEach(b=>{
      const cur=data.commOvr[b.id]||{amount:null,memo:'',skip:false,skipWhy:'',checked:false};
      cur.checked=on; cur.checkedAt=on?(cur.checkedAt||now):'';
      data.commOvr[b.id]=cur;
    });
    renderBkComm();
    for(const b of day)await saveOvr(b.id);
    return;
  }
  /* 건별 제외 — 중복 입력 등 */
  const bs=e.target.closest('[data-bcskipbk]');
  if(bs){
    e.stopPropagation();
    const id=bs.dataset.bcskipbk;
    const cur=data.commOvr[id]||{amount:null,memo:'',skip:false,skipWhy:'',checked:false};
    cur.skip=!cur.skip; cur.skipWhy=cur.skip?'중복':'';
    data.commOvr[id]=cur;
    renderPay(); renderBkComm();
    await saveOvr(id);
    return;
  }
  const h=e.target.closest('[data-bcday]'); if(!h)return;
  bcToggle(h.dataset.bcday);
});
$('bcList').addEventListener('input',e=>{
  const el=e.target.closest('.bcaddamt,.bcaddmemo'); if(!el)return;
  const bf=bcBuf(el.dataset.d);
  if(el.classList.contains('bcaddamt'))bf.amt=el.value; else bf.memo=el.value;
});
$('bcList').addEventListener('keydown',e=>{
  const aa=e.target.closest('.bcaddamt,.bcaddmemo');
  if(aa&&e.key==='Enter'){e.preventDefault();bcAddGo(aa.dataset.d);return;}
  if(e.key!=='Enter'&&e.key!==' ')return;
  if(e.target.closest('input,select,textarea'))return;
  const h=e.target.closest('[data-bcday]'); if(!h)return;
  e.preventDefault(); bcToggle(h.dataset.bcday);
});

/** 날짜 한 줄 저장 — '커미션 안 주는 날' 표시와 매출보정이 한 줄에 있습니다 */
async function saveCommDay(d){
  const skip=!!(data.commSkip&&data.commSkip.has(d)), dc=dayDisc(d);
  if(!skip&&dc<=0)
    return op(t('opComm'),()=>sb.from('staff_comm_skip').delete().eq('day',d));
  return op(t('opComm'),()=>sb.from('staff_comm_skip')
    .upsert({day:d,skip,discount:dc},{onConflict:'day'}));
}
/** 건별 기록을 한 줄로 저장합니다 — 실제 결제 · 제외 · 확인이 같은 줄입니다.
    예전에는 칸마다 따로 써서 한쪽을 고치면 다른 쪽이 지워졌습니다. */
async function saveOvr(id){
  const o=data.commOvr[id];
  const empty=!o||(o.amount==null&&!o.skip&&!o.checked&&!o.payKind&&!String(o.memo||'').trim());
  if(empty){
    delete data.commOvr[id];
    return op(t('opComm'),()=>sb.from('staff_comm_override').delete().eq('booking_id',id));
  }
  return op(t('opComm'),()=>sb.from('staff_comm_override').upsert({
    booking_id:Number(id), amount:o.amount==null?null:Number(o.amount), memo:o.memo||'',
    skip:!!o.skip, skip_why:o.skip?(o.skipWhy||'중복'):'',
    checked:!!o.checked, checked_at:o.checked?(o.checkedAt||new Date().toISOString()):null,
    pay_kind:o.payKind||null
  },{onConflict:'booking_id'}));
}

async function saveBookingField(b,patch){
  Object.assign(b,patch);
  const {...row}=b;                       // 불러올 때 넣은 id 는 원본에도 있던 값입니다

/* 실제 결제액 덮어쓰기 · 담당자별 비율 · 고객 정보 */
$('bcList').addEventListener('change',async e=>{
  const bf=e.target.closest('[data-bkf]');
  if(bf){
    const b=(data.bookings||[]).find(x=>String(x.id)===String(bf.dataset.id)); if(!b)return;
    const k=bf.dataset.bkf, v=bf.value.trim();
    if(k==='name'&&!v){bf.value=b.name||'';return;}   // 이름은 비울 수 없습니다
    if(b[k]===v)return;
    renderBkComm();
    await saveBookingField(b,{[k]:v});
    return;
  }
  /* 매출보정 — 그날 깎인 총액. 각 건의 금액에 비례해서 나눠 뺍니다 */
  const dd=e.target.closest('[data-bcdisc]');
  if(dd){
    const d=dd.dataset.bcdisc;
    const g=dayGross(d);
    let v=Math.max(0,Math.round(Number(dd.value||0)));
    if(v>g)v=Math.round(g);            // 그날 받은 돈보다 많이 깎일 수는 없습니다
    data.commDisc=data.commDisc||{};
    v>0?data.commDisc[d]=v:delete data.commDisc[d];
    renderPay(); renderBkComm();
    await saveCommDay(d);
    return;
  }
  /* 직접 넣은 건의 결제 경로 */
  const cp=e.target.closest('[data-cmpay]');
  if(cp){
    const c=(data.commissions||[]).find(x=>String(x.id)===String(cp.dataset.cmpay)); if(!c)return;
    c.payKind=cp.value;
    c.amount=cmPayoutOf(c);
    renderComm(); renderPay();
    await op(t('opComm'),()=>sb.from('staff_commissions')
      .update({pay_kind:c.payKind||null,amount:c.amount}).eq('id',c.id));
    return;
  }
  /* 결제 경로 — 고와비인데 현장으로 적힌 건 등을 바로잡습니다 */
  const pk=e.target.closest('[data-bcpay]');
  if(pk){
    const id=pk.dataset.bcpay, v=pk.value;
    const cur=data.commOvr[id]||{amount:null,memo:'',skip:false,skipWhy:'',checked:false,payKind:''};
    cur.payKind=v;
    data.commOvr[id]=cur;
    renderPay(); renderBkComm();
    await saveOvr(id);
    return;
  }
  /* 메뉴명 — 예약장부 원본이 같이 바뀝니다 */
  const tr=e.target.closest('[data-bktreat]');
  if(tr){
    const b=(data.bookings||[]).find(x=>String(x.id)===String(tr.dataset.id)); if(!b)return;
    const v=tr.value.trim(), ix=tr.dataset.bktreat;
    if(ix==='-'){ if((b.treat||'')===v)return; await saveBookingField(b,{treat:v}); }
    else{
      const i=Number(ix), items=(b.items||[]).slice();
      if(!items[i]||String(items[i].treat||'')===v)return;
      items[i]={...items[i],treat:v};
      await saveBookingField(b,{items});
    }
    renderBkComm();
    return;
  }
  /* 담당자 더하기 */
  const sa=e.target.closest('[data-bkstaffadd]');
  if(sa){
    const b=(data.bookings||[]).find(x=>String(x.id)===String(sa.dataset.bkstaffadd)); if(!b)return;
    const n=sa.value; if(!n)return;
    const names=bkNames(b);
    if(names.includes(n)){sa.value='';return;}
    renderPay();
    await saveBookingField(b,{staff:names.concat(n).join(', ')});
    renderBkComm();
    return;
  }
  const ov=e.target.closest('[data-bcovr]');
  if(ov){
    const id=ov.dataset.bcovr;
    const raw=ov.value.trim();
    const amt=raw===''?null:Math.max(0,Number(raw));
    const cur=data.commOvr[id]||{amount:null,memo:'',skip:false,skipWhy:'',checked:false};
    cur.amount=amt;
    data.commOvr[id]=cur;
    renderPay(); renderBkComm();
    await saveOvr(id);
    return;
  }
  const sp=e.target.closest('[data-bcsplit]');
  if(sp){
    const id=sp.dataset.bcsplit, n=sp.dataset.bn, raw=sp.value.trim();
    const key=id+'|'+n;
    if(raw===''){
      delete data.commSplit[key];
      renderPay(); renderBkComm();
      await op(t('opComm'),()=>sb.from('staff_comm_split').delete()
        .eq('booking_id',id).eq('booking_name',n));
    }else{
      const w=Math.max(0,Number(raw)||0);
      data.commSplit[key]=w;
      renderPay(); renderBkComm();
      await op(t('opComm'),()=>sb.from('staff_comm_split')
        .upsert({booking_id:Number(id),booking_name:n,share:w},{onConflict:'booking_id,booking_name'}));
    }
  }
});

const FORMS=()=>window.STAFF_FORMS||{};
let docCur=null, docStaff='', docWarn='';

function renderDocs(){
  const F=FORMS(), keys=Object.keys(F);
  if(!keys.length){$('docList').innerHTML=`<div class="empty">${t('docMissing')}</div>`;return;}
  if(!docCur)docCur=keys[0];
  $('docList').innerHTML='<div class="doccards">'+keys.map(k=>{
    const d=F[k];
    return `<div class="doccard${k===docCur?' on':''}" data-doc="${k}">
      <span class="cd">${esc(d.code||'')}</span>
      <b>${esc(d.ko)}</b><i>${esc(d.th||'')}</i>
      <small>${esc(d.note||'')}</small>
      ${(d.pdf||d.docx)?`<span class="dl">
        ${d.pdf?`<a href="${d.pdf}" download onclick="event.stopPropagation()">${t('dlPdf')}</a>`:''}
        ${d.docx?`<a href="${d.docx}" download onclick="event.stopPropagation()">${t('dlDocx')}</a>`:''}
      </span>`:''}</div>`;
  }).join('')+'</div>';

  /* 도구 막대 — 경고서만 직원 · 경고 선택 */
  const d=F[docCur]||{};
  const warnable=docCur==='04';
  const staffOpts=liveStaff().map(x=>`<option value="${esc(x.name)}"${x.name===docStaff?' selected':''}>${esc(x.name)}</option>`).join('');
  const wl=(data.warnings||[]).filter(w=>w.staff===docStaff&&w.level==='서면')
    .sort((a,b)=>b.date.localeCompare(a.date));
  $('docTools').innerHTML=(warnable?`
      <label style="margin:0 4px 0 0;font-size:11.5px">${t('lStaff')}</label>
      <select id="docStaffSel" style="min-width:150px"><option value="">—</option>${staffOpts}</select>
      <label style="margin:0 4px 0 10px;font-size:11.5px">${t('docWarnPick')}</label>
      <select id="docWarnSel" style="min-width:230px">
        <option value="">${t('docBlank')}</option>
        ${wl.map(w=>`<option value="${w.id}"${String(w.id)===String(docWarn)?' selected':''}>${
          w.date} · ${esc((w.reason||'').slice(0,26))}</option>`).join('')}
      </select>`:'')
    +(d.guide?'':`<span style="flex:1"></span>
      ${d.pdf?`<a class="ghost" href="${d.pdf}" download style="text-decoration:none">${t('dlPdfBtn')}</a>`:''}
      ${d.docx?`<a class="ghost" href="${d.docx}" download style="text-decoration:none">${t('dlDocxBtn')}</a>`:''}
      <button class="ghost" id="docPrint">${t('printScreen')}</button>`);

  $('docSheet').innerHTML=fillForm(docCur,d.html||'');
}

/** 경고서 자동 채움 — 나머지 문서는 원본 그대로 */
function fillForm(key,html){
  if(key!=='04')return html;
  const w=(data.warnings||[]).find(x=>String(x.id)===String(docWarn));
  const s=data.staff.find(x=>x.name===(w?w.staff:docStaff));
  const blank='<span style="color:var(--line)">………………………</span>';
  let nth='', prior='';
  if(w){
    // 이 경고 시점 기준으로 몇 번째 유효 서면 경고인가
    const list=(data.warnings||[]).filter(x=>x.staff===w.staff&&x.level==='서면'
      &&x.date<=w.date&&warnValid(x,w.date)).sort((a,b)=>a.date.localeCompare(b.date));
    const n=list.findIndex(x=>String(x.id)===String(w.id))+1;
    nth=[1,2,3].map(i=>`${i===n?'☑':'☐'} ${i}${i===3?' (ครั้งสุดท้าย)':''}`).join('&nbsp;&nbsp;');
    prior=list.filter(x=>String(x.id)!==String(w.id)).map((x,i)=>{
      const exp=new Date(x.date); exp.setFullYear(exp.getFullYear()+1);
      return `<tr><td><div class="ln">${i+1}</div></td><td>&nbsp;</td>
        <td><div class="ln">${esc(x.reason||'')}</div></td>
        <td><div class="ln">${x.date} / ${exp.toISOString().slice(0,10)}</div></td></tr>`;
    }).join('')||`<tr><td colspan="4" style="color:var(--ink-soft)">${t('warnNone')}</td></tr>`;
  }else{
    nth='☐ 1&nbsp;&nbsp;☐ 2&nbsp;&nbsp;☐ 3 (ครั้งสุดท้าย)';
    prior=[1,2].map(i=>`<tr><td><div class="ln">${i}</div></td>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>`).join('');
  }
  return html
    .replace('{{ISSUE_DATE}}', w?w.date:blank)
    .replace('{{NTH}}', nth)
    .replace('{{NAME}}', s?esc(s.name):(docStaff?esc(docStaff):blank))
    .replace('{{HIRE}}', (s&&s.hireDate)?s.hireDate:blank)
    .replace('{{ISSUER}}', blank)
    .replace('{{REASON}}', w&&w.reason
      ? `<b>${esc(w.reason)}</b><br><span style="color:var(--ink-soft);font-size:11px">${
          t('docFromApp')} · ${w.date}</span>`
      : '&nbsp;')
    .replace('{{PRIOR}}', prior);
}

  $('bkText').value=JSON.stringify({app:'hnhy-attitude',v:3,exported:new Date().toISOString(),
    staff:data.staff.map(strip),records:data.records.map(strip),
    evals:Object.fromEntries(Object.entries(data.evals||{}).map(([k,v])=>[k,strip(v)])),
    warnings:(data.warnings||[]).map(strip),
    payroll:Object.fromEntries(Object.entries(data.payroll||{}).map(([k,v])=>[k,strip(v)])),
    commissions:(data.commissions||[]).map(strip),
    fixedCosts:(data.fixedCosts||[]).map(strip),
    // 고정비 납부는 항목 id 대신 legacy_id 로 키를 잡아야 다른 DB 로 옮겨도 이어집니다
    fixedPays:Object.fromEntries(Object.entries(data.fixedPays||{}).map(([k,v])=>{
      const cut=k.lastIndexOf('|'), c=data.fixedCosts.find(x=>String(x.id)===k.slice(0,cut));
      return [(c?lidOf('fx',c):k.slice(0,cut))+'|'+k.slice(cut+1),strip(v)];
    })),
    expenses:(data.expenses||[]).map(strip),
    payees:(data.payees||[]).map(strip),
    // 커미션 규칙 — 이름 잇기는 직원 이름으로 옮겨야 다른 DB 에서도 이어집니다
    commCfg:{...(data.commCfg||{})},
    nameMap:Object.fromEntries(Object.entries(data.nameMap||{}).map(([bn,id])=>{
      const s=data.staff.find(x=>x._id===id); return [bn,s?s.name:null];
    })),
    commSplit:{...(data.commSplit||{})},
    commOvr:Object.fromEntries(Object.entries(data.commOvr||{})
      .filter(([,v])=>v&&(v.amount!=null||v.skip||v.checked||v.payKind))),
    targets:Object.fromEntries(Object.entries(data.targets||{}).map(([k,v])=>[k,strip(v)])),
    // 급여 이력은 직원 이름으로 키를 잡아야 다른 DB 로 옮겨도 이어집니다
    wageHist:Object.fromEntries(data.staff.filter(x=>(data.wageHist[x._id]||[]).length)
      .map(x=>[x.name,(data.wageHist[x._id]||[]).map(h=>{const{id,...r}=h;return r;})]))});
  const ms=[...new Set(data.records.map(r=>r.date.slice(0,7)))].sort();
  $('bkStat').textContent=`${t('bkStaffN')} ${data.staff.length}${t('cnt')} · ${t('bkRecN')} ${data.records.length}${t('cntRec')}`
    +(ms.length?` · ${ms[0]} ~ ${ms[ms.length-1]}`:'')+` · ${$('bkText').value.length.toLocaleString()} ${t('bkChars')}`;
}
function bkSay(msg,color){
  $('bkNote').innerHTML=`<b style="color:${color}">${msg}</b>`;
  clearTimeout(bkSay._t);
  bkSay._t=setTimeout(()=>{$('bkNote').innerHTML=t('bkNote');},5000);
}
function parseBackup(){
  const x=$('bkText').value.trim();
  if(!x){bkSay(t('bkEmpty'),'var(--coral)');return null;}
  let o; try{o=JSON.parse(x);}catch(e){bkSay(t('bkBad'),'var(--coral)');return null;}
  if(!o||!Array.isArray(o.staff)||!Array.isArray(o.records)){bkSay(t('bkNotMine'),'var(--coral)');return null;}
  return o;
}

  catch(e){$('bkText').select();bkSay(t('bkManual'),'var(--amber)');}

$('bkFile').addEventListener('click',()=>{

$('bkOpen').addEventListener('change',e=>{

});

const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};

/** 백업 JSON → Supabase 업로드 (합치기). legacy_id 로 중복을 막습니다. */
let importSkipped=0;
async function importBackup(o){
  bkSay(t('bkUploading'),'var(--amber)');
  importSkipped=0;

  // 1) 직원 — 이름이 없을 때만 새로 넣습니다 (기존 직원 정보는 건드리지 않음)
  const have=new Set(data.staff.map(s=>s.name));
  const newStaff=(o.staff||[]).filter(s=>s&&s.name&&!have.has(s.name));
  // 명단에는 없는데 기록에만 등장하는 이름도 함께 만들어 둡니다 (기록 유실 방지)
  const listed=new Set([...have,...newStaff.map(s=>s.name)]);
  [...(o.records||[]),...(o.commissions||[]),...(o.warnings||[])].forEach(r=>{
    if(r&&r.staff&&!listed.has(r.staff)){
      listed.add(r.staff);
      newStaff.push({name:r.staff,sched:'10:30',type:'정직원'});
    }
  });
  if(newStaff.length){
    const rows=newStaff.map((s,i)=>({...staffToRow(s),sort_order:data.staff.length+i}));
    const r=await op(t('opImport')+' · '+t('opStaff'),()=>sb.from('staff_members').insert(rows).select());
    if(!r.ok)return false;
  }
  // 1-b) 고정비 항목 — legacy_id 로 중복을 거릅니다
  if(isAdmin){
    const fxRows=(o.fixedCosts||[]).filter(c=>c&&c.name).map((c,i)=>({
      name:c.name,biz:c.biz||DEF_BIZ,category:c.category||'기타',amount:Number(c.amount||0),
      due_day:c.dueDay==null||c.dueDay===''?null:Number(c.dueDay),
      active:c.active!==false,start_month:c.startMonth||null,end_month:c.endMonth||null,
      memo:c.memo||'',sort_order:c.sortOrder??i,legacy_id:lidOf('fx',c)}));
    for(const part of chunk(fxRows,400)){
      const r=await op(t('opImport')+' · '+t('opFix'),
        ()=>sb.from('staff_fixed_costs').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
  }

  await loadAll();
  const sid=n=>sidOf(n);

  // 2) 근태 기록
  const skipped=(o.records||[]).filter(r=>!(r&&r.date&&sid(r.staff))).length;
  if(skipped)importSkipped=skipped;
  const recRows=(o.records||[]).filter(r=>r&&r.date&&sid(r.staff)).map(r=>({
    staff_id:sid(r.staff),date:r.date,sched:r.sched||'',actual:r.actual||'',
    out_time:r.out||'',late:r.late==null?null:Number(r.late),type:r.type||'정상',
    scores:r.scores||{},avg_score:r.avg==null?null:Number(r.avg),memo:r.memo||'',
    legacy_id:lidOf('rec',r)
  }));
  for(const part of chunk(recRows,400)){
    const r=await op(t('opImport')+' · '+t('opRec'),
      ()=>sb.from('staff_records').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
    if(!r.ok)return false;
  }

  if(isAdmin){
    // 3) 커미션
    const cmRows=(o.commissions||[]).filter(c=>c&&c.date&&sid(c.staff)).map(c=>({
      staff_id:sid(c.staff),date:c.date,amount:Number(c.amount||0),memo:c.memo||'',
      legacy_id:lidOf('cm',c)}));
    for(const part of chunk(cmRows,400)){
      const r=await op(t('opImport')+' · '+t('opComm'),
        ()=>sb.from('staff_commissions').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
    // 4) 경고
    const wRows=(o.warnings||[]).filter(w=>w&&w.date&&sid(w.staff)).map(w=>({
      staff_id:sid(w.staff),level:w.level||'서면',reason:w.reason||'',date:w.date,
      legacy_id:lidOf('wn',w)}));
    for(const part of chunk(wRows,400)){
      const r=await op(t('opImport')+' · '+t('opWarn'),
        ()=>sb.from('staff_warnings').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
    // 5) 급여 — 직원+월 복합키
    const pRows=Object.entries(o.payroll||{}).map(([k,v])=>{
      const cut=k.lastIndexOf('|'), nm=k.slice(0,cut), mo=k.slice(cut+1);
      if(!sid(nm)||!mo)return null;
      return {staff_id:sid(nm),month:mo,base:num(v.base),comm:num(v.comm),
        bonus:num(v.bonus),deduct:num(v.deduct),paid:!!v.paid,paid_date:v.date||null};
    }).filter(Boolean);
    for(const part of chunk(pRows,400)){
      const r=await op(t('opImport')+' · '+t('opPay'),
        ()=>sb.from('staff_payroll').upsert(part,{onConflict:'staff_id,month'}));
      if(!r.ok)return false;
    }
    // 6) 고정비 월별 납부 — 백업의 키는 항목 legacy_id 이므로 현재 id 로 되돌립니다
    const fxByLid=new Map(data.fixedCosts.map(c=>[lidOf('fx',c),c.id]));
    const fpRows=Object.entries(o.fixedPays||{}).map(([k,v])=>{
      const cut=k.lastIndexOf('|'), cid=fxByLid.get(k.slice(0,cut)), mo=k.slice(cut+1);
      if(!cid||!mo)return null;
      return {cost_id:cid,month:mo,amount:num(v.amount),paid:!!v.paid,
        paid_date:v.date||null,memo:v.memo||''};
    }).filter(Boolean);
    for(const part of chunk(fpRows,400)){
      const r=await op(t('opImport')+' · '+t('opFix'),
        ()=>sb.from('staff_fixed_payments').upsert(part,{onConflict:'cost_id,month'}));
      if(!r.ok)return false;
    }
    // 7) 소모품 · 기타 지출
    const exRows=(o.expenses||[]).filter(e=>e&&e.date).map(e=>({
      date:e.date,biz:e.biz||DEF_BIZ,category:e.category||'기타',item:e.item||'',
      amount:Number(e.amount||0),memo:e.memo||'',
      paid_by:e.payer||COMPANY,reimbursed_at:e.reimbursedAt||null,
      legacy_id:lidOf('ex',e)}));
    for(const part of chunk(exRows,400)){
      const r=await op(t('opImport')+' · '+t('opExp'),
        ()=>sb.from('staff_expenses').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
    // 7-2) 기타 이체 계좌
    const pyRows=(o.payees||[]).filter(p=>p&&p.name).map((p,i)=>({
      name:p.name,biz:p.biz||DEF_BIZ,category:p.category||'기타',
      bank_name:p.bankName||'',bank_account:p.bankAcct||'',bank_holder:p.bankHolder||'',
      memo:p.memo||'',active:p.active!==false,sort_order:p.sortOrder??i,
      legacy_id:lidOf('py',p)}));
    for(const part of chunk(pyRows,400)){
      const r=await op(t('opImport')+' · '+t('opPayee'),
        ()=>sb.from('staff_payees').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
    // 7-3) 커미션 규칙 (비율 · 이름 잇기 · 나누는 비율 · 실제 결제액)
    if(o.commCfg&&typeof o.commCfg==='object'){
      const r=await op(t('opImport')+' · '+t('opComm2'),()=>sb.from('staff_comm_config').upsert({
        id:1,rate:Number(o.commCfg.rate??3),
        gowabi_basis:o.commCfg.gowabiBasis||'net',
        min_amount:Number(o.commCfg.minAmount||0)},{onConflict:'id'}));
      if(!r.ok)return false;
    }
    const nmRows=Object.entries(o.nameMap||{}).map(([bn,nm])=>
      bn?{booking_name:bn,staff_id:nm?sid(nm):null}:null).filter(Boolean);
    for(const part of chunk(nmRows,400)){
      const r=await op(t('opImport')+' · '+t('opComm2'),
        ()=>sb.from('staff_name_map').upsert(part,{onConflict:'booking_name'}));
      if(!r.ok)return false;
    }
    const spRows=Object.entries(o.commSplit||{}).map(([k,v])=>{
      const cut=k.indexOf('|'); if(cut<1)return null;
      const bid=Number(k.slice(0,cut)); if(!bid)return null;
      return {booking_id:bid,booking_name:k.slice(cut+1),share:Number(v||0)};
    }).filter(Boolean);
    for(const part of chunk(spRows,400)){
      const r=await op(t('opImport')+' · '+t('opComm2'),
        ()=>sb.from('staff_comm_split').upsert(part,{onConflict:'booking_id,booking_name'}));
      if(!r.ok)return false;
    }
    const ovRows=Object.entries(o.commOvr||{}).map(([k,v])=>{
      const bid=Number(k); if(!bid||!v)return null;
      if(v.amount==null&&!v.skip&&!v.checked&&!v.payKind)return null;
      return {booking_id:bid,amount:v.amount==null?null:Number(v.amount),memo:v.memo||'',
              skip:!!v.skip,skip_why:v.skipWhy||'',
              checked:!!v.checked,checked_at:v.checkedAt||null,pay_kind:v.payKind||null};
    }).filter(Boolean);
    for(const part of chunk(ovRows,400)){
      const r=await op(t('opImport')+' · '+t('opComm2'),
        ()=>sb.from('staff_comm_override').upsert(part,{onConflict:'booking_id'}));
      if(!r.ok)return false;
    }
    // 8) 매출 목표 — 사업장 + 월 복합키
    const tgRows2=Object.entries(o.targets||{}).map(([k,v])=>{
      const cut=k.lastIndexOf('|'), bz=k.slice(0,cut), mo=k.slice(cut+1);
      if(!bz||!mo)return null;
      return {biz:bz,month:mo,amount:Number(v.amount||0),memo:v.memo||''};
    }).filter(Boolean);
    for(const part of chunk(tgRows2,400)){
      const r=await op(t('opImport')+' · '+t('opTarget'),
        ()=>sb.from('staff_targets').upsert(part,{onConflict:'biz,month'}));
      if(!r.ok)return false;
    }
    // 9) 급여 변경 이력 — 직원 + 적용월 복합키
    const whRows=[];
    Object.entries(o.wageHist||{}).forEach(([nm,arr])=>{
      const id=sid(nm); if(!id||!Array.isArray(arr))return;
      arr.forEach(h=>{ if(h&&h.fromMonth)whRows.push({staff_id:id,from_month:h.fromMonth,
        pay_type:h.payType||'일급',wage:Number(h.wage||0),memo:h.memo||''}); });
    });
    for(const part of chunk(whRows,400)){
      const r=await op(t('opImport')+' · '+t('opWage'),
        ()=>sb.from('staff_wage_history').upsert(part,{onConflict:'staff_id,from_month'}));
      if(!r.ok)return false;
    }
  }

  // 6) 평가 의견 — 직원+월 복합키
  const eRows=Object.entries(o.evals||{}).map(([k,v])=>{
    const cut=k.lastIndexOf('|'), nm=k.slice(0,cut), mo=k.slice(cut+1);
    if(!sid(nm)||!mo)return null;
    return {staff_id:sid(nm),month:mo,good:v.good||'',improve:v.improve||'',plan:v.plan||''};
  }).filter(Boolean);
  for(const part of chunk(eRows,400)){
    const r=await op(t('opImport')+' · '+t('opEval'),
      ()=>sb.from('staff_evals').upsert(part,{onConflict:'staff_id,month'}));
    if(!r.ok)return false;
  }

  await loadAll(); bkDirty=false; renderStaff(); render();
  return true;
}

$('bkMerge').addEventListener('click',async()=>{
  if(!isAdmin){bkSay(t('bkNeedAdm'),'var(--coral)');openAdm();return;}
  const o=parseBackup(); if(!o)return;
  const before=data.records.length, sBefore=data.staff.length;
  if(await importBackup(o))
    bkSay(`✓ ${t('bkRecN')} +${data.records.length-before} · ${t('bkStaffN')} +${data.staff.length-sBefore}`
      +(importSkipped?` · <span style="color:var(--coral)">${t('bkSkipped')} ${importSkipped}</span>`:''),'var(--jade)');
});

$('bkReplace').addEventListener('click',async()=>{
  if(!isAdmin){bkSay(t('bkNeedAdm'),'var(--coral)');openAdm();return;}
  const o=parseBackup(); if(!o)return;
  if(!confirm(`${data.records.length} → ${o.records.length}\n\n${t('bkConfirmReplace')}`))return;
  // 직원을 지우면 CASCADE 로 기록 · 급여 · 커미션 · 경고 · 평가가 함께 지워집니다
  const NONE='00000000-0000-0000-0000-000000000000';
  const del=await op(t('opDel'),()=>sb.from('staff_members').delete().neq('id',NONE));
  if(!del.ok)return;
  // 고정비 · 지출은 직원과 연결돼 있지 않으므로 따로 지웁니다
  for(const tb of ['staff_fixed_costs','staff_expenses','staff_targets','staff_payees']){
    const d=await op(t('opDel')+' · '+tb,()=>sb.from(tb).delete().neq('id',NONE));
    if(!d.ok)return;
  }
  data=EMPTY();
  if(await importBackup(o))bkSay(`✓ ${data.records.length}`,'var(--jade)');
});

/* ══════════════════════════════════════════════════════════════════════════
   비밀번호 게이트 · 관리자 잠금
   ══════════════════════════════════════════════════════════════════════════ */
async function signIn(email,password){
  try{
    const {data:d,error}=await sb.auth.signInWithPassword({email,password});
    if(error)return {ok:false,error};
    return {ok:true,session:d.session};
  }catch(e){return {ok:false,error:e,net:true};}
}

$('gateGo').addEventListener('click',doGate);
$('gatePw').addEventListener('keydown',e=>{if(e.key==='Enter')doGate();});
async function doGate(){
  const pw=$('gatePw').value;
  if(!pw)return;
  $('gateErr').textContent='';
  $('gateGo').disabled=true;
  // 관리자 비밀번호로도 바로 들어올 수 있습니다
  let r=await signIn(CFG.staffEmail,pw);
  if(!r.ok)r=await signIn(CFG.adminEmail,pw);
  $('gateGo').disabled=false;
  if(!r.ok){
    $('gateErr').textContent=r.net?t('gateNet'):t('gateBad');
    $('gatePw').select(); return;
  }
  $('gatePw').value='';
  await enterApp(r.session);
}

function openAdm(){
  $('admErr').textContent=''; $('admPw').value='';
  $('admModal').classList.add('on');
  setTimeout(()=>$('admPw').focus(),50);
}
document.body.addEventListener('click',e=>{if(e.target.closest('.admOpen'))openAdm();});
$('admClose').addEventListener('click',()=>$('admModal').classList.remove('on'));
$('admCancel').addEventListener('click',()=>$('admModal').classList.remove('on'));
$('admModal').addEventListener('click',e=>{if(e.target===$('admModal'))$('admModal').classList.remove('on');});
$('admGo').addEventListener('click',doAdm);
$('admPw').addEventListener('keydown',e=>{if(e.key==='Enter')doAdm();});
async function doAdm(){
  const pw=$('admPw').value; if(!pw)return;
  $('admGo').disabled=true; $('admErr').textContent='';
  const r=await signIn(CFG.adminEmail,pw);
  $('admGo').disabled=false;
  if(!r.ok){$('admErr').textContent=r.net?t('gateNet'):t('admBad');$('admPw').select();return;}
  $('admPw').value='';
  $('admModal').classList.remove('on');
  await enterApp(r.session);
}
/* 관리자 잠그기 — 직원 계정으로 되돌립니다 */
$('admLockBtn').addEventListener('click',async()=>{
  await sb.auth.signOut();
  isAdmin=false; document.body.classList.remove('adm');
  data=EMPTY();
  if(liveCh){sb.removeChannel(liveCh);liveCh=null;}
  document.body.classList.add('locked');
  $('gate').classList.add('on');
  setTimeout(()=>$('gatePw').focus(),50);
});

async function enterApp(session){
  myEmail=(session&&session.user&&session.user.email)||'';
  isAdmin=!!CFG.adminEmail&&myEmail.toLowerCase()===String(CFG.adminEmail).toLowerCase();
  document.body.classList.toggle('adm',isAdmin);
  $('gate').classList.remove('on');
  document.body.classList.remove('locked');
  setNet('con');
  if(await loadAll())await seedIfEmpty();
  await setLang(LANG,false);
  subscribeLive();
}

/* ══════════ boot ══════════ */
(async()=>{
  try{LANG=localStorage.getItem('hnhy-lang')||'ko';}catch(e){}
  applyI18n();
  if(!CFG.url||!CFG.anonKey||/YOUR-(PROJECT|ANON)/.test(CFG.url+CFG.anonKey)){
    $('gateErr').textContent=t('cfgBad');
    $('gateGo').disabled=true;
    return;
  }
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{
    auth:{persistSession:true,autoRefreshToken:true,storageKey:'hnhy-staff-auth'},
    realtime:{params:{eventsPerSecond:5}}
  });
  const {data:d}=await sb.auth.getSession();
  if(d&&d.session)await enterApp(d.session);
  else setTimeout(()=>$('gatePw').focus(),80);
})();
</script>
