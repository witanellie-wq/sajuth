<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직원 근태 · 업무태도 관리 · HANAHAYAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+Thai:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131C2E; --ink-soft:#5A6472; --paper:#F6F7F5; --card:#FFFFFF;
    --line:#DFE3E0; --line-soft:#EDEFEC;
    --jade:#2E7D6B; --amber:#C98A0E; --coral:#BE4237; --violet:#5B4B8A; --slate:#69758A;
    --r:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Noto Sans KR','Noto Sans Thai',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  body.th{font-family:'Noto Sans Thai','Noto Sans KR',system-ui,sans-serif;line-height:1.7;}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 80px;}
  body.locked .wrap{display:none;}

  header{border-bottom:2px solid var(--ink);padding-bottom:12px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);}
  h1{margin:4px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .sub{font-size:12px;color:var(--ink-soft);font-weight:300;margin-top:2px;}
  .hd-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .today{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}

  /* language switch */
  .lang{display:flex;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden;}
  .lang button{background:#fff;border:none;padding:7px 14px;font-size:12.5px;font-weight:700;
    cursor:pointer;color:var(--ink-soft);font-family:'Noto Sans KR','Noto Sans Thai',sans-serif;}
  .lang button + button{border-left:1px solid var(--line);}
  .lang button.on{background:var(--ink);color:#fff;}

  .bk-open{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;
    font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-soft);}
  .bk-open:hover{border-color:var(--ink);color:var(--ink);}

  nav{display:flex;margin:18px 0 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  nav button{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;
    padding:11px 15px;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;}
  nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink);}
  .view{display:none;} .view.on{display:block;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;}
  .panel h2{margin:0 0 16px;font-size:12.5px;font-weight:700;letter-spacing:.05em;
    padding-bottom:8px;border-bottom:1px solid var(--line);}

  label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-soft);margin:0 0 5px;}
  input,select,textarea,button{font-family:inherit;font-size:14px;color:var(--ink);}
  input[type=text],input[type=time],input[type=date],input[type=month],input[type=password],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:#FCFDFC;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--jade);box-shadow:0 0 0 3px rgba(46,125,107,.14);}
  textarea{resize:vertical;min-height:62px;}
  .field{margin-bottom:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row2 .field{margin-bottom:0;}
  .nowbtn{margin-top:6px;font-size:11px;background:none;border:none;color:var(--jade);cursor:pointer;
    padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px;font-family:inherit;}
  .ghost{background:none;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;
    font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-soft);}
  .ghost:hover{border-color:var(--ink);color:var(--ink);}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar input,.toolbar select{width:auto;font-size:13px;padding:7px 9px;}

  .cols{display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start;}
  @media(max-width:900px){.cols{grid-template-columns:1fr;}}

  .readout{font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;
    padding:12px 14px;background:#EFF1EE;border-left:3px solid var(--line);margin:14px 0;}
  .readout small{display:block;font-family:inherit;font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px;}
  body.th .readout small{font-family:'Noto Sans Thai',sans-serif;}
  .readout.late{border-left-color:var(--coral);color:var(--coral);background:#FBF0EF;}
  .readout.ok{border-left-color:var(--jade);color:var(--jade);background:#EEF5F3;}
  .readout.flat{font-size:16px;font-family:inherit;font-weight:700;}

  .types{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .types input{position:absolute;opacity:0;pointer-events:none;}
  .types label{margin:0;padding:9px 6px;text-align:center;border:1px solid var(--line);border-radius:var(--r);
    cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-soft);background:#FCFDFC;}
  .types input:checked + label{background:var(--ink);border-color:var(--ink);color:#fff;}
  .types input:focus-visible + label{box-shadow:0 0 0 3px rgba(46,125,107,.3);}

  .score{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line);}
  .score:last-of-type{border-bottom:none;}
  .score span{font-size:12.5px;font-weight:500;}
  .dots{display:flex;gap:4px;}
  .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);padding:0;line-height:1;}
  .dot.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600;}
  .dot.on.low{background:var(--coral);border-color:var(--coral);}
  .save{width:100%;margin-top:16px;padding:12px;background:var(--ink);color:#fff;border:none;
    border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;}
  .save:hover{background:#000;}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line-soft);font-size:13px;}
  th{font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--ink);}
  td.num,th.num{text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:500;}
  th.num{font-family:inherit;}
  td.bad{color:var(--coral);font-weight:600;}
  td.off{color:var(--slate);}

  .grid-scroll{overflow-x:auto;}
  table.grid{border-collapse:separate;border-spacing:2px;}
  table.grid th.d{font-size:9.5px;width:24px;text-align:center;padding:2px 0;border:none;color:var(--ink-soft);font-weight:500;letter-spacing:0;}
  table.grid th.d.we{color:var(--coral);}
  table.grid th.nm{border:none;text-align:left;min-width:110px;padding-left:0;}
  table.grid td.nm{border:none;font-size:13px;font-weight:700;white-space:nowrap;padding-left:0;}
  table.grid td.sum{border:none;font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;padding:0 0 0 6px;}
  .cell{width:24px;height:26px;border-radius:2px;background:var(--line-soft);border:none;padding:0;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#B9BFBA;cursor:default;}
  body.th .cell{font-family:'Noto Sans Thai',sans-serif;font-size:10px;}
  /* 색은 '출근 구분'과 '태도 점수' 중 나쁜 쪽을 따릅니다 (sev() 참고) */
  .cell.sv0{background:#B4DCCF;color:#17564A;}      /* 우수 4.5+ */
  .cell.sv1{background:#DDECE7;color:var(--jade);}   /* 정상 */
  .cell.sv2{background:#F7EBCE;color:var(--amber);}  /* 주의 */
  .cell.sv3{background:#F2D5D2;color:var(--coral);}  /* 문제 */
  .cell.svSick{background:#E4DFEF;color:var(--violet);}
  .cell.svOff{background:#D8DDE4;color:var(--slate);}
  .cell.휴무{cursor:pointer;}
  .cell.reg-off{background:#EAEDF1;color:#A7B0BC;display:inline-block;line-height:26px;}
  .cell.mark-off{cursor:pointer;}
  .cell.mark-off:hover{background:#D8DDE4;color:var(--slate);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--ink-soft);}
  .legend b{display:inline-block;width:18px;height:18px;border-radius:2px;text-align:center;line-height:18px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;margin-right:5px;vertical-align:-4px;}

  .tier{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .t0,.t1{background:#EEF5F3;color:var(--jade);} .t2{background:#FBF4E3;color:var(--amber);}
  .t3{background:#FBF0EF;color:var(--coral);} .t4{background:#F0EDF6;color:var(--violet);}
  .gr{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .gr.A{color:var(--jade);} .gr.B{color:var(--ink);} .gr.C{color:var(--amber);} .gr.D{color:var(--coral);}

  .entry{border-left:3px solid var(--line);padding:9px 0 9px 12px;margin-bottom:7px;background:#FCFDFC;
    display:flex;gap:12px;align-items:flex-start;}
  .entry.sv0{border-left-color:#17564A;background:#F7FBF9;}
  .entry.sv1{border-left-color:var(--jade);}
  .entry.sv2{border-left-color:var(--amber);background:#FDFBF5;}
  .entry.sv3{border-left-color:var(--coral);background:#FDF7F6;}
  .entry.svSick{border-left-color:var(--violet);}
  .entry.svOff{border-left-color:var(--slate);}
  .sc{font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .sc.sv0{color:#17564A;} .sc.sv1{color:var(--jade);}
  .sc.sv2{color:var(--amber);} .sc.sv3{color:var(--coral);}
  .legend2{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;padding-top:8px;
    border-top:1px dotted var(--line);font-size:11px;color:var(--ink-soft);align-items:center;}
  .legend2 b{display:inline-block;width:18px;height:18px;border-radius:2px;margin-right:5px;vertical-align:-4px;}
  .entry .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);min-width:92px;}
  .entry .body{flex:1;font-size:13px;}
  .entry .body em{font-style:normal;color:var(--ink-soft);}
  .entry .body p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .del{background:none;border:none;color:var(--line);cursor:pointer;font-size:16px;padding:2px 4px;}
  .del:hover{color:var(--coral);}
  .empty{padding:28px 10px;text-align:center;color:var(--ink-soft);font-size:13px;border:1px dashed var(--line);border-radius:var(--r);}
  .note{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}

  .hr-add{display:flex;gap:10px;align-items:flex-end;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
  @media(max-width:600px){.hr-add{flex-wrap:wrap;}}
  #hrTable input[type=text],#hrTable input[type=time]{border-color:transparent;background:transparent;padding:5px 6px;font-weight:500;}
  #hrTable input:hover{border-color:var(--line);background:#FCFDFC;}
  #hrTable input:focus{border-color:var(--jade);background:#fff;}
  .rm{background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--ink-soft);
    font-size:11px;padding:4px 10px;cursor:pointer;font-family:inherit;}
  .rm:hover{border-color:var(--coral);color:var(--coral);}
  .rm:disabled{opacity:.35;cursor:not-allowed;}
  .dow{display:flex;gap:3px;}
  .dw{width:28px;height:26px;border:1px solid var(--line);border-radius:2px;background:#FCFDFC;
    font-size:11px;font-weight:500;color:var(--ink-soft);cursor:pointer;padding:0;font-family:inherit;}
  .dw.su{color:var(--coral);} .dw.sa{color:#4A6FA5;}
  .dw:hover{border-color:var(--ink);}
  .dw.on{background:var(--slate);border-color:var(--slate);color:#fff!important;font-weight:700;}

  /* warnings */
  .wcard{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
  .wcard.fire{border-color:var(--coral);background:#FCF3F2;}
  .wcard-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .wcard-top b{font-size:14px;font-weight:700;}
  .wpips{display:flex;gap:5px;}
  .wpip{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;
    font-weight:600;color:#C3C8C3;background:#fff;}
  .wpip.on{background:var(--coral);border-color:var(--coral);color:#fff;}
  .wpip.thr{border-style:dashed;}
  .fire-badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;background:var(--coral);color:#fff;white-space:nowrap;}
  .wbtn{background:none;border:1px solid var(--coral);color:var(--coral);border-radius:var(--r);
    font-size:11.5px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:inherit;}
  .wbtn:hover{background:var(--coral);color:#fff;}
  .wbtn.v{border-color:var(--amber);color:var(--amber);}
  .wbtn.v:hover{background:var(--amber);color:#fff;}
  .whist{margin-top:10px;padding-top:10px;border-top:1px dotted var(--line);}
  .wrow{display:flex;gap:10px;align-items:flex-start;font-size:12px;padding:4px 0;color:var(--ink-soft);}
  .wrow .wd{font-family:'IBM Plex Mono',monospace;min-width:82px;}
  .wrow .wl{font-weight:700;min-width:78px;}
  .wrow.exp{opacity:.5;text-decoration:line-through;}
  .wrow .wx{margin-left:auto;background:none;border:none;color:var(--line);cursor:pointer;font-size:14px;}
  .wrow .wx:hover{color:var(--coral);}

  /* employment */
  #empTable td{vertical-align:middle;}
  #empTable input,#empTable select{padding:6px 8px;font-size:13px;}
  #empTable input[type=number]{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .intern-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:#EAF0F6;color:#4A6FA5;white-space:nowrap;}
  .intern-badge.done{background:#EFF1EE;color:var(--ink-soft);}
  .pay-est{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--jade);}
  .intern-fields{display:flex;gap:4px;align-items:center;}
  .intern-fields input{width:130px;}
  .intern-fields.hide{display:none;}

  /* payroll */
  #payTable td,#payTable th{vertical-align:middle;}
  #payTable input[type=number]{width:100%;}
  #payTable input[type=date]{width:100%;}
  .paytot{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  #cmList table{margin-top:4px;}
  .edb{color:var(--line);font-size:13px;}
  .edb:hover{color:var(--jade);}
  #edModal .modal-box{max-width:520px;}
  #edScores{border:1px solid var(--line-soft);border-radius:var(--r);padding:2px 12px;}

  /* modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(19,28,46,.55);z-index:50;padding:24px;overflow:auto;}
  .modal.on{display:flex;align-items:flex-start;justify-content:center;}
  .modal-box{background:#fff;border-radius:var(--r);padding:26px 28px;max-width:660px;width:100%;
    margin:auto;box-shadow:0 18px 50px rgba(19,28,46,.28);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:17px;font-weight:700;}
  .modal-x{background:none;border:none;font-size:24px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:0 2px;}
  .modal-x:hover{color:var(--coral);}
  #bkText{min-height:150px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.45;}
  .bk-stat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
  .bk-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  /* ── 비밀번호 게이트 ── */
  .gate{display:none;position:fixed;inset:0;background:var(--paper);z-index:90;
    align-items:center;justify-content:center;padding:24px;overflow:auto;}
  .gate.on{display:flex;}
  .gate-box{background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:32px 30px;max-width:390px;width:100%;box-shadow:0 18px 50px rgba(19,28,46,.10);}
  .gate-box h2{margin:6px 0 4px;font-size:19px;font-weight:700;}
  .gate-box .save{margin-top:14px;}
  .gate-err{font-size:12px;color:var(--coral);font-weight:600;margin-top:10px;min-height:18px;}
  .gate-lang{display:flex;justify-content:center;margin-top:18px;}

  /* ── 관리자 잠금 ── */
  .lockbox{border:1px dashed var(--line);border-radius:var(--r);padding:30px 20px;text-align:center;}
  .lockbox p{margin:0 0 14px;font-size:13px;color:var(--ink-soft);}
  .lockbox .ghost{border-color:var(--ink);color:var(--ink);font-weight:600;padding:9px 18px;font-size:13px;}
  .adm-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
    background:#EEF5F3;color:var(--jade);border:1px solid #CFE2DC;cursor:pointer;}
  body:not(.adm) .adm-only{display:none!important;}
  body.adm .lockbox{display:none!important;}
  body.adm .lockbox-wrap{display:none!important;}

  /* ── 지출 요약 카드 ── */
  .sumcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:700px){.sumcards{grid-template-columns:1fr 1fr;}}
  .sumcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#FCFDFC;}
  .sumcard b{display:block;font-size:10px;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .sumcard i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
  .sumcard small{display:block;font-size:10px;color:var(--ink-soft);margin-top:2px;font-family:inherit;}
  .sumcard.total{background:var(--ink);border-color:var(--ink);}
  .sumcard.total b{color:#9AA5B5;} .sumcard.total i,.sumcard.total small{color:#fff;}
  .duebox{margin-top:14px;border:1px solid var(--amber);background:#FDF8EC;border-radius:var(--r);
    padding:11px 14px;font-size:12.5px;color:#8A5E06;}
  .duebox b{color:var(--coral);}
  /* 지급 상태 토글 — 체크박스는 "체크하면 미지급?" 으로 읽혀서 버튼으로 둡니다 */
  .paybtn{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:6px 14px;
    font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;
    border:1px solid var(--coral);background:#fff;color:var(--coral);}
  .paybtn:hover{background:var(--coral);color:#fff;}
  .paybtn.on{background:var(--jade);border-color:var(--jade);color:#fff;}
  .paybtn.on:hover{background:#fff;color:var(--jade);}
  .paydate{margin-top:5px;padding:4px 6px!important;font-size:11.5px;max-width:140px;}
  /* 분류 콤보 — 직접 입력 + 언제든 목록 열기 (input[list] 는 값이 있으면 목록이 걸러져서 직접 만듭니다) */
  input.hascombo{padding-right:26px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),
                     linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 10px) calc(50% + 1px);
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .combo-pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);
    border-radius:var(--r);box-shadow:0 10px 28px rgba(19,28,46,.18);
    max-height:240px;overflow:auto;min-width:150px;display:none;padding:4px 0;}
  .combo-pop.on{display:block;}
  .combo-pop button{display:block;width:100%;text-align:left;background:none;border:none;
    padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .combo-pop button:hover{background:#EEF5F3;}

function paintFail(){
  const box=$('netErr');
  if(!failQ.length){box.classList.remove('on');box.innerHTML='';return;}
  const last=failQ[failQ.length-1];
  box.innerHTML=`${t('netFail')}<br>${failQ.length}${t('netFailN')}
    <small>${esc(last.label)} · ${esc(last.msg)}</small>
    <button id="netRetryBtn">${t('netRetry')}</button>`;
  box.classList.add('on');
  $('netRetryBtn').onclick=retryFailed;
}
async function retryFailed(){
  const q=failQ.splice(0,failQ.length); paintFail();
  for(const f of q){ if(f.fn) await op(f.label,f.fn); }
  await loadAll(); safeRender();
}
/** Supabase 호출 래퍼 — 실패하면 화면에 경고를 띄우고 재시도 큐에 넣습니다. */
async function op(label,fn,retryable=true){
  try{
    const r=await fn();
    if(r&&r.error)throw r.error;
    setNet(liveCh?'live':'con');
    return {ok:true,data:r?r.data:null};
  }catch(e){
    const msg=(e&&(e.message||e.error_description))||String(e);
    failQ.push({label,fn:retryable?fn:null,msg});
    setNet('off'); paintFail();
    return {ok:false,error:e};
  }
}

/** 입력 중에는 다시 그리지 않고, 포커스가 빠질 때 그립니다. */
function safeRender(){
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!ae.closest('.gate,.modal')){

function subscribeLive(){
  if(liveCh){sb.removeChannel(liveCh);liveCh=null;}
  const ch=sb.channel('staff-sync-'+Math.random().toString(36).slice(2));
  // RLS 로 못 읽는 테이블은 구독하지 않습니다 (직원 계정에서 채널 오류 방지)
  const tables=['staff_members','staff_records','staff_evals']
    .concat(isAdmin?['staff_payroll','staff_commissions','staff_warnings',
                     'staff_fixed_costs','staff_fixed_payments','staff_expenses']:[]);
  tables.forEach(tb=>ch.on('postgres_changes',{event:'*',schema:'public',table:tb},scheduleReload));
  ch.subscribe(st=>{
    if(st==='SUBSCRIBED'){liveCh=ch;setNet('live');}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){liveCh=null;setNet('off');}
  });
}

/* ══════════ stats ══════════ */
function isRegOff(name,iso){
  const s=data.staff.find(x=>x.name===name);
  if(!s||!Array.isArray(s.off)||!s.off.length)return false;
  const[Y,M,D]=iso.split('-').map(Number);
  return s.off.includes(new Date(Y,M-1,D).getDay());
}
const daysInMonth=m=>{const[Y,M]=m.split('-').map(Number);return new Date(Y,M,0).getDate();};

/* ── 기록 한 건의 심각도 ──────────────────────────────────────────────
   출근 구분만으로 색을 정하면 "정상 출근인데 태도 1점" 이 초록으로 보입니다.
   그래서 근태 쪽 등급과 태도 점수 등급 중 '나쁜 쪽'을 따릅니다.
     sv0 우수(4.5+) · sv1 정상 · sv2 주의 · sv3 문제 · svSick 병가 · svOff 휴무   */
const SCORE_SEV=a=>a<2.5?3:a<3.5?2:a>=4.5?0:1;
function sev(r){
  if(r.type==='휴무')return 'svOff';
  if(r.type==='병가')return 'svSick';
  let s=(r.type==='무단'||r.type==='무단결근')?3
       :(r.type==='사전통보')?2
       :(r.late>0)?2:1;
  if(r.avg!=null){
    const a=SCORE_SEV(r.avg);
    s=Math.max(s,a);              // 나쁜 쪽이 이깁니다
    if(a===0&&s===1)s=0;          // 근태도 정상 + 태도도 최고 → 우수
  }
  return 'sv'+s;
}

// 발부일로부터 12개월 이내면 유효
function warnValid(w,ref){
  const iss=new Date(w.date), r=ref?new Date(ref):new Date();
  const exp=new Date(iss); exp.setFullYear(exp.getFullYear()+1);
  return r<exp;
}
// 특정 직원의 유효 서면 경고 수 (기준일 시점)
function activeWarnings(name,ref){
  return (data.warnings||[]).filter(w=>w.staff===name&&w.level==='서면'&&warnValid(w,ref)).length;
}
const canFire=(name,ref)=>activeWarnings(name,ref)>=FIRE_THRESHOLD;

function stat(name,month){
  const rs=data.records.filter(r=>r.staff===name&&r.date.startsWith(month));
  const lateCnt=rs.filter(r=>r.late>0).length;
  const unex=rs.filter(r=>r.type==='무단'||r.type==='무단결근').length;
  const totalLate=rs.reduce((a,r)=>a+(r.late||0),0);
  const avgs=rs.map(r=>r.avg).filter(v=>v!=null);
  const avg=avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null;
  const adj=avg!=null?Math.max(0,avg-unex*0.3):null;
  const grade=adj==null?'–':adj>=4.5?'A':adj>=3.5?'B':adj>=2.5?'C':'D';
  const days=rs.filter(r=>!['휴무','병가','무단결근'].includes(r.type)).length;
  let off=rs.filter(r=>r.type==='휴무').length;
  const nd=daysInMonth(month);
  for(let d=1;d<=nd;d++){
    const iso=`${month}-${pad(d)}`;
    if(!rs.some(r=>r.date===iso)&&isRegOff(name,iso))off++;
  }
  const sick=rs.filter(r=>r.type==='병가').length;
  const hours=rs.reduce((a,r)=>a+hoursOf(r),0);
  return{rs,days,off,sick,hours,lateCnt,unex,totalLate,avg,adj,grade,tier:Math.min(unex,4)};
}

/* ══════════ 급여 · 커미션 ══════════ */
const commOf=(name,month)=>(data.commissions||[]).filter(c=>c.staff===name&&(c.date||'').startsWith(month))
  .reduce((a,c)=>a+Number(c.amount||0),0);
function estPay(s,month){
  const w=Number(s.wage||0); if(!w)return null;
  const x=stat(s.name,month), pt=defPayType(s);
  if(pt==='월급')return w;
  if(pt==='시급')return Math.round(x.hours*w);
  return x.days*w;
}
const payKey=(n,m)=>n+'|'+m;
const payOf=(n,m)=>(data.payroll||{})[payKey(n,m)]||{};
function payCalc(s,m){
  const auto=estPay(s,m)||0, autoC=commOf(s.name,m), p=payOf(s.name,m);
  const base=num(p.base)!=null?num(p.base):auto;
  const comm=num(p.comm)!=null?num(p.comm):autoC;
  const bonus=Number(p.bonus||0), deduct=Number(p.deduct||0);
  return{auto,autoC,base,comm,bonus,deduct,total:base+comm+bonus-deduct,p};
}

/** 그 달 납부일이 이미 지났는가 (이번 달일 때만 의미 있음) */
function isPastDue(m,day){
  const now=todayISO();
  if(now.slice(0,7)>m)return true;
  if(now.slice(0,7)<m)return false;
  return Number(now.slice(8,10))>Number(day);
}

/* ══════════ 분류 콤보 — 직접 입력하면서 목록도 언제든 열립니다 ══════════ */
const COMBO={fix:{list:()=>FIXCATS,used:()=>data.fixedCosts.map(c=>c.category)},
             exp:{list:()=>EXCATS,used:()=>(data.expenses||[]).map(e=>e.category)}};
let comboEl=null;
/** filter=true 는 '타이핑 중' 일 때만. 그냥 클릭해서 열면 값이 들어 있어도 전체를 보여줍니다
    (기존 값을 다른 것으로 바꾸려면 전체가 보여야 하니까요) */
function comboOpen(inp,filter){
  const cfg=COMBO[inp.dataset.combo]; if(!cfg)return;
  const pop=$('comboPop'), src=cfg.list();
  const presets=src.map(x=>x[0]);
  const mine=[...new Set(cfg.used())].filter(v=>v&&!presets.includes(v)).sort();
  const cur=(inp.value||'').trim();
  const q=filter?cur.toLowerCase():'';
  const match=v=>{
    if(!q)return true;
    const pr=src.find(x=>x[0]===v);
    return v.toLowerCase().includes(q)||(pr&&t(pr[1]).toLowerCase().includes(q));
  };
  // 타이핑한 것과 맞는 게 하나도 없으면 거르지 않고 전부 보여줍니다
  const anyHit=[...presets,...mine].some(match);
  const row=v=>{
    const pr=src.find(x=>x[0]===v);
    return `<button type="button" data-cv="${esc(v)}"${v===cur?' style="font-weight:700;background:#EEF5F3"':''}>${
      v===cur?'✓ ':''}${esc(v)}${pr&&LANG!=='ko'?`<small>${esc(t(pr[1]))}</small>`:''}</button>`;
  };
  const sec=(title,vals)=>vals.length?`<div class="chd">${title}</div>`+vals.map(row).join(''):'';
  pop.innerHTML=sec(t('catPreset'),presets.filter(v=>!anyHit||match(v)))
              +sec(t('catMine'),mine.filter(v=>!anyHit||match(v)));
  const r=inp.getBoundingClientRect();
  pop.style.left=Math.min(r.left,innerWidth-190)+'px';
  pop.style.top=(r.bottom+3)+'px';
  pop.style.minWidth=Math.max(r.width,150)+'px';
  pop.classList.add('on');
  comboEl=inp;
}
const comboClose=()=>{$('comboPop').classList.remove('on');comboEl=null;};
document.addEventListener('focusin',e=>{
  const inp=e.target.closest&&e.target.closest('input[data-combo]');
  if(inp)comboOpen(inp);
});
document.addEventListener('click',e=>{
  const inp=e.target.closest('input[data-combo]');
  if(inp){comboOpen(inp);return;}
  if(!e.target.closest('#comboPop'))comboClose();
});
document.addEventListener('input',e=>{
  const inp=e.target.closest('input[data-combo]');
  if(inp&&comboEl===inp)comboOpen(inp,true);   // 타이핑할 때만 걸러냅니다
});
$('comboPop').addEventListener('click',e=>{
  const b=e.target.closest('[data-cv]'); if(!b||!comboEl)return;
  const inp=comboEl;
  inp.value=b.dataset.cv;
  comboClose();
  inp.blur();                                     // 다시 그리기 전에 포커스를 뗍니다
  inp.dispatchEvent(new Event('change',{bubbles:true}));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')comboClose();});
window.addEventListener('scroll',()=>{if(comboEl)comboClose();},true);
window.addEventListener('resize',()=>{if(comboEl)comboClose();});

const fixOf=id=>data.fixedCosts.find(c=>String(c.id)===String(id));
$('fixTable').addEventListener('change',async e=>{
  const m=$('exMonth').value;
  const f=e.target.closest('[data-fx]');
  if(f){   // 항목 자체 (이름 · 분류 · 납부일)
    const c=fixOf(f.dataset.id); if(!c)return;
    const k=f.dataset.fx, patch={};
    if(k==='name'){const v=f.value.trim();if(!v){f.value=c.name;return;}c.name=v;patch.name=v;}
    else if(k==='biz'){c.biz=f.value||DEF_BIZ;patch.biz=c.biz;}
    else if(k==='category'){const v=f.value.trim()||'기타';c.category=v;patch.category=v;}
    else if(k==='memo'){c.memo=f.value;patch.memo=c.memo;}
    else if(k==='amount'){
      const v=f.value===''?0:Math.max(0,Number(f.value));
      c.amount=v; patch.amount=v; f.value=v||'';
    }
    else if(k==='dueDay'){
      const v=f.value===''?null:Math.min(31,Math.max(1,Number(f.value)));
      c.dueDay=v; patch.due_day=v; if(v)f.value=v;
    }
    renderEx();
    await op(t('opFix'),()=>sb.from('staff_fixed_costs').update(patch).eq('id',c.id));
    return;
  }
  const p=e.target.closest('[data-fxp]');
  if(p){   // 이 달의 금액 · 납부 여부
    const c=fixOf(p.dataset.id); if(!c)return;
    const key=c.id+'|'+m;
    const cur=data.fixedPays[key]=data.fixedPays[key]||{amount:null,paid:false,date:'',memo:''};
    const k=p.dataset.fxp;
    if(k==='date'){cur.date=p.value;}
    else{cur.amount=p.value===''?null:Number(p.value);}
    renderEx();
    await saveFixedPay(c.id,m,cur);
  }
});

async function saveFixedPay(costId,m,cur){
  return op(t('opFix'),()=>sb.from('staff_fixed_payments').upsert({
    cost_id:costId,month:m,amount:cur.amount,paid:!!cur.paid,
    paid_date:cur.date||null,memo:cur.memo||''
  },{onConflict:'cost_id,month'}));
}
$('fixTable').addEventListener('click',async e=>{
  const pt=e.target.closest('[data-fxpaid]');
  if(pt){
    const m=$('exMonth').value, id=pt.dataset.fxpaid, key=id+'|'+m;
    const cur=data.fixedPays[key]=data.fixedPays[key]||{amount:null,paid:false,date:'',memo:''};
    cur.paid=!cur.paid;
    if(cur.paid&&!cur.date)cur.date=todayISO();
    renderEx();
    await saveFixedPay(id,m,cur);
    return;
  }
  const stop=e.target.closest('[data-fxstop]')||e.target.closest('[data-fxresume]');
  if(stop){
    const id=stop.dataset.fxstop||stop.dataset.fxresume;
    const c=fixOf(id); if(!c)return;
    c.active=!!stop.dataset.fxresume;
    renderEx();
    await op(t('opFix'),()=>sb.from('staff_fixed_costs').update({active:c.active}).eq('id',c.id));
    return;
  }
  const del=e.target.closest('[data-fxdel]');
  if(del){
    if(!confirm(t('fixDelConfirm')))return;
    const id=del.dataset.fxdel;
    data.fixedCosts=data.fixedCosts.filter(c=>String(c.id)!==String(id));
    Object.keys(data.fixedPays).forEach(k=>{if(k.slice(0,k.lastIndexOf('|'))===String(id))delete data.fixedPays[k];});
    renderEx();
    // staff_fixed_payments 는 ON DELETE CASCADE 로 함께 지워집니다
    await op(t('opFix')+' · '+t('opDel'),()=>sb.from('staff_fixed_costs').delete().eq('id',id));
  }
});

/** 직원 한 명의 변경분을 서버에 반영 */
async function pushStaff(s,patch){
  return op(t('opStaff'),()=>sb.from('staff_members').update(patch).eq('id',s._id));
}

$('hrTable').addEventListener('change',async e=>{
  const el=e.target.closest('[data-hr]'); if(!el)return;
  const i=+el.dataset.i2, s=data.staff[i];
  if(el.dataset.hr==='sched'){
    s.sched=el.value;
    await pushStaff(s,{sched:s.sched});
  }else{
    const nn=el.value.trim(), old=s.name;
    if(!nn){el.value=old;return;}
    if(data.staff.some((x,j)=>j!==i&&x.name===nn)){alert(t('dupName'));el.value=old;return;}
    // DB 는 staff_id 참조라 이름만 바꾸면 모든 기록이 따라옵니다 (화면도 즉시 동기화)
    const res=await pushStaff(s,{name:nn});
    if(!res.ok){el.value=old;return;}
    data.records.forEach(r=>{if(r.staff===old)r.staff=nn;});
    (data.commissions||[]).forEach(c=>{if(c.staff===old)c.staff=nn;});
    (data.warnings||[]).forEach(w=>{if(w.staff===old)w.staff=nn;});
    [['evals',data.evals],['payroll',data.payroll]].forEach(([,obj])=>{
      Object.keys(obj||{}).forEach(k=>{
        const cut=k.lastIndexOf('|');
        if(k.slice(0,cut)===old){obj[`${nn}|${k.slice(cut+1)}`]=obj[k];delete obj[k];}
      });
    });
    s.name=nn;
  }
  renderStaff(); render();
});

$('hrTable').addEventListener('click',async e=>{
  const o=e.target.closest('[data-off]');
  if(o){
    const s=data.staff[+o.dataset.off],w=+o.dataset.w;
    s.off=s.off||[];
    s.off=s.off.includes(w)?s.off.filter(x=>x!==w):[...s.off,w].sort();
    render();
    await pushStaff(s,{off:s.off});
    return;
  }
  const rs=e.target.closest('[data-res]');
  if(rs){
    const s=data.staff[+rs.dataset.res];
    s.resigned=!s.resigned; s.resignDate=s.resigned?todayISO():undefined;
    renderStaff(); render();
    await pushStaff(s,{resigned:s.resigned,resign_date:s.resignDate||null});
    return;
  }
  const b=e.target.closest('[data-rm]'); if(!b)return;
  const i=+b.dataset.rm, s=data.staff[i];
  const n=data.records.filter(r=>r.staff===s.name).length;
  if(n){
    if(!confirm(`${s.name} (${n}${t('cntRec')})\n\n${t('delStaffRec')}`))return;
  } else if(!confirm(`${s.name} ${t('confirmDelStaff')}`))return;
  // DB 는 ON DELETE CASCADE — 기록 · 커미션 · 급여 · 경고 · 평가가 함께 지워집니다
  const res=await op(t('opStaff')+' · '+t('opDel'),
    ()=>sb.from('staff_members').delete().eq('id',s._id));
  if(!res.ok)return;
  data.records=data.records.filter(r=>r.staff!==s.name);
  data.warnings=(data.warnings||[]).filter(w=>w.staff!==s.name);
  data.commissions=(data.commissions||[]).filter(c=>c.staff!==s.name);
  Object.keys(data.payroll||{}).forEach(k=>{if(k.slice(0,k.lastIndexOf('|'))===s.name)delete data.payroll[k];});
  Object.keys(data.evals||{}).forEach(k=>{if(k.slice(0,k.lastIndexOf('|'))===s.name)delete data.evals[k];});
  data.staff.splice(i,1);
  renderStaff(); render();
});

  const list=liveStaff();

      <td class="num" style="font-size:12px">${x.days}${t('day')}${x.hours?`<br><span style="color:var(--ink-soft)">${x.hours.toFixed(1)}${t('hrs')}</span>`:''}</td>

  $('bkText').value=JSON.stringify({app:'hnhy-attitude',v:3,exported:new Date().toISOString(),

    commissions:(data.commissions||[]).map(strip),
    fixedCosts:(data.fixedCosts||[]).map(strip),
    // 고정비 납부는 항목 id 대신 legacy_id 로 키를 잡아야 다른 DB 로 옮겨도 이어집니다
    fixedPays:Object.fromEntries(Object.entries(data.fixedPays||{}).map(([k,v])=>{
      const cut=k.lastIndexOf('|'), c=data.fixedCosts.find(x=>String(x.id)===k.slice(0,cut));
      return [(c?lidOf('fx',c):k.slice(0,cut))+'|'+k.slice(cut+1),strip(v)];

  const ms=[...new Set(data.records.map(r=>r.date.slice(0,7)))].sort();

function parseBackup(){

const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};

/** 백업 JSON → Supabase 업로드 (합치기). legacy_id 로 중복을 막습니다. */
let importSkipped=0;
async function importBackup(o){
  bkSay(t('bkUploading'),'var(--amber)');
  importSkipped=0;

  // 1) 직원 — 이름이 없을 때만 새로 넣습니다 (기존 직원 정보는 건드리지 않음)
  const have=new Set(data.staff.map(s=>s.name));
  const newStaff=(o.staff||[]).filter(s=>s&&s.name&&!have.has(s.name));
  // 명단에는 없는데 기록에만 등장하는 이름도 함께 만들어 둡니다 (기록 유실 방지)
  const listed=new Set([...have,...newStaff.map(s=>s.name)]);
  [...(o.records||[]),...(o.commissions||[]),...(o.warnings||[])].forEach(r=>{
    if(r&&r.staff&&!listed.has(r.staff)){
      listed.add(r.staff);
      newStaff.push({name:r.staff,sched:'10:30',type:'정직원'});
    }
  });
  if(newStaff.length){
    const rows=newStaff.map((s,i)=>({...staffToRow(s),sort_order:data.staff.length+i}));
    const r=await op(t('opImport')+' · '+t('opStaff'),()=>sb.from('staff_members').insert(rows).select());
    if(!r.ok)return false;
  }
  // 1-b) 고정비 항목 — legacy_id 로 중복을 거릅니다
  if(isAdmin){
    const fxRows=(o.fixedCosts||[]).filter(c=>c&&c.name).map((c,i)=>({
      name:c.name,biz:c.biz||DEF_BIZ,category:c.category||'기타',amount:Number(c.amount||0),
      due_day:c.dueDay==null||c.dueDay===''?null:Number(c.dueDay),
      active:c.active!==false,start_month:c.startMonth||null,end_month:c.endMonth||null,
      memo:c.memo||'',sort_order:c.sortOrder??i,legacy_id:lidOf('fx',c)}));
    for(const part of chunk(fxRows,400)){
      const r=await op(t('opImport')+' · '+t('opFix'),
        ()=>sb.from('staff_fixed_costs').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
  }

  await loadAll();
  const sid=n=>sidOf(n);

  // 2) 근태 기록
  const skipped=(o.records||[]).filter(r=>!(r&&r.date&&sid(r.staff))).length;
  if(skipped)importSkipped=skipped;
  const recRows=(o.records||[]).filter(r=>r&&r.date&&sid(r.staff)).map(r=>({
    staff_id:sid(r.staff),date:r.date,sched:r.sched||'',actual:r.actual||'',
    out_time:r.out||'',late:r.late==null?null:Number(r.late),type:r.type||'정상',
    scores:r.scores||{},avg_score:r.avg==null?null:Number(r.avg),memo:r.memo||'',
    legacy_id:lidOf('rec',r)
  }));
  for(const part of chunk(recRows,400)){
    const r=await op(t('opImport')+' · '+t('opRec'),
      ()=>sb.from('staff_records').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
    if(!r.ok)return false;
  }

  if(isAdmin){
    // 3) 커미션
    const cmRows=(o.commissions||[]).filter(c=>c&&c.date&&sid(c.staff)).map(c=>({
      staff_id:sid(c.staff),date:c.date,amount:Number(c.amount||0),memo:c.memo||'',
      legacy_id:lidOf('cm',c)}));
    for(const part of chunk(cmRows,400)){
      const r=await op(t('opImport')+' · '+t('opComm'),
        ()=>sb.from('staff_commissions').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
    // 4) 경고
    const wRows=(o.warnings||[]).filter(w=>w&&w.date&&sid(w.staff)).map(w=>({
      staff_id:sid(w.staff),level:w.level||'서면',reason:w.reason||'',date:w.date,
      legacy_id:lidOf('wn',w)}));
    for(const part of chunk(wRows,400)){
      const r=await op(t('opImport')+' · '+t('opWarn'),
        ()=>sb.from('staff_warnings').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
    // 5) 급여 — 직원+월 복합키
    const pRows=Object.entries(o.payroll||{}).map(([k,v])=>{
      const cut=k.lastIndexOf('|'), nm=k.slice(0,cut), mo=k.slice(cut+1);
      if(!sid(nm)||!mo)return null;
      return {staff_id:sid(nm),month:mo,base:num(v.base),comm:num(v.comm),
        bonus:num(v.bonus),deduct:num(v.deduct),paid:!!v.paid,paid_date:v.date||null};
    }).filter(Boolean);
    for(const part of chunk(pRows,400)){
      const r=await op(t('opImport')+' · '+t('opPay'),
        ()=>sb.from('staff_payroll').upsert(part,{onConflict:'staff_id,month'}));
      if(!r.ok)return false;
    }
    // 6) 고정비 월별 납부 — 백업의 키는 항목 legacy_id 이므로 현재 id 로 되돌립니다
    const fxByLid=new Map(data.fixedCosts.map(c=>[lidOf('fx',c),c.id]));
    const fpRows=Object.entries(o.fixedPays||{}).map(([k,v])=>{
      const cut=k.lastIndexOf('|'), cid=fxByLid.get(k.slice(0,cut)), mo=k.slice(cut+1);
      if(!cid||!mo)return null;
      return {cost_id:cid,month:mo,amount:num(v.amount),paid:!!v.paid,
        paid_date:v.date||null,memo:v.memo||''};
    }).filter(Boolean);
    for(const part of chunk(fpRows,400)){
      const r=await op(t('opImport')+' · '+t('opFix'),
        ()=>sb.from('staff_fixed_payments').upsert(part,{onConflict:'cost_id,month'}));
      if(!r.ok)return false;
    }
    // 7) 소모품 · 기타 지출
    const exRows=(o.expenses||[]).filter(e=>e&&e.date).map(e=>({
      date:e.date,biz:e.biz||DEF_BIZ,category:e.category||'기타',item:e.item||'',
      amount:Number(e.amount||0),memo:e.memo||'',legacy_id:lidOf('ex',e)}));
    for(const part of chunk(exRows,400)){
      const r=await op(t('opImport')+' · '+t('opExp'),
        ()=>sb.from('staff_expenses').upsert(part,{onConflict:'legacy_id',ignoreDuplicates:true}));
      if(!r.ok)return false;
    }
  }

  // 6) 평가 의견 — 직원+월 복합키
  const eRows=Object.entries(o.evals||{}).map(([k,v])=>{
    const cut=k.lastIndexOf('|'), nm=k.slice(0,cut), mo=k.slice(cut+1);
    if(!sid(nm)||!mo)return null;
    return {staff_id:sid(nm),month:mo,good:v.good||'',improve:v.improve||'',plan:v.plan||''};
  }).filter(Boolean);
  for(const part of chunk(eRows,400)){
    const r=await op(t('opImport')+' · '+t('opEval'),
      ()=>sb.from('staff_evals').upsert(part,{onConflict:'staff_id,month'}));
    if(!r.ok)return false;
  }

  await loadAll(); bkDirty=false; renderStaff(); render();
  return true;
}

$('bkMerge').addEventListener('click',async()=>{
  if(!isAdmin){bkSay(t('bkNeedAdm'),'var(--coral)');openAdm();return;}
  const o=parseBackup(); if(!o)return;
  const before=data.records.length, sBefore=data.staff.length;
  if(await importBackup(o))
    bkSay(`✓ ${t('bkRecN')} +${data.records.length-before} · ${t('bkStaffN')} +${data.staff.length-sBefore}`
      +(importSkipped?` · <span style="color:var(--coral)">${t('bkSkipped')} ${importSkipped}</span>`:''),'var(--jade)');
});

$('bkReplace').addEventListener('click',async()=>{
  if(!isAdmin){bkSay(t('bkNeedAdm'),'var(--coral)');openAdm();return;}
  const o=parseBackup(); if(!o)return;
  if(!confirm(`${data.records.length} → ${o.records.length}\n\n${t('bkConfirmReplace')}`))return;
  // 직원을 지우면 CASCADE 로 기록 · 급여 · 커미션 · 경고 · 평가가 함께 지워집니다
  const NONE='00000000-0000-0000-0000-000000000000';
  const del=await op(t('opDel'),()=>sb.from('staff_members').delete().neq('id',NONE));
  if(!del.ok)return;
  // 고정비 · 지출은 직원과 연결돼 있지 않으므로 따로 지웁니다
  for(const tb of ['staff_fixed_costs','staff_expenses']){
    const d=await op(t('opDel')+' · '+tb,()=>sb.from(tb).delete().neq('id',NONE));
    if(!d.ok)return;
  }
  data=EMPTY();
  if(await importBackup(o))bkSay(`✓ ${data.records.length}`,'var(--jade)');
});

/* 기록 삭제 (로그) */
document.body.addEventListener('click',async e=>{
  const b=e.target.closest('.del'); if(!b||!b.dataset.id)return;
  if(!confirm(t('confirmDel')))return;
  const id=b.dataset.id;
  data.records=data.records.filter(r=>String(r.id)!==String(id));
  render();
  await op(t('opRec')+' · '+t('opDel'),()=>sb.from('staff_records').delete().eq('id',id));
});
['logMonth','gridMonth','stSel','evStaff','evMonth'].forEach(id=>$(id).addEventListener('change',render));
$('payMonth').addEventListener('change',()=>{if(isAdmin){renderPay();renderComm();}});
$('gridPrint').addEventListener('click',()=>window.print());
$('evPrint').addEventListener('click',()=>window.print());
$('csvBtn').addEventListener('click',()=>{
  const rs=data.records.filter(r=>r.date.startsWith($('logMonth').value));
  const head=['date','staff','sched','actual','late_min','type',...CRIT.map(c=>c[0]),'avg','memo'];
  const body=rs.map(r=>[r.date,r.staff,r.sched,r.actual,r.late??'',r.type,
    ...CRIT.map((_,i)=>r.scores?.[i]??''),r.avg??'',(r.memo||'').replace(/"/g,'""')]);
  const csv='\uFEFF'+[head,...body].map(row=>row.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`attendance_${$('logMonth').value}.csv`; a.click();
});

/* ══════════════════════════════════════════════════════════════════════════
   비밀번호 게이트 · 관리자 잠금
   ══════════════════════════════════════════════════════════════════════════ */
async function signIn(email,password){
  try{
    const {data:d,error}=await sb.auth.signInWithPassword({email,password});
    if(error)return {ok:false,error};
    return {ok:true,session:d.session};
  }catch(e){return {ok:false,error:e,net:true};}
}

$('gateGo').addEventListener('click',doGate);
$('gatePw').addEventListener('keydown',e=>{if(e.key==='Enter')doGate();});
async function doGate(){
  const pw=$('gatePw').value;
  if(!pw)return;
  $('gateErr').textContent='';
  $('gateGo').disabled=true;
  // 관리자 비밀번호로도 바로 들어올 수 있습니다
  let r=await signIn(CFG.staffEmail,pw);
  if(!r.ok)r=await signIn(CFG.adminEmail,pw);
  $('gateGo').disabled=false;
  if(!r.ok){
    $('gateErr').textContent=r.net?t('gateNet'):t('gateBad');
    $('gatePw').select(); return;
  }
  $('gatePw').value='';
  await enterApp(r.session);
}

function openAdm(){
  $('admErr').textContent=''; $('admPw').value='';
  $('admModal').classList.add('on');
  setTimeout(()=>$('admPw').focus(),50);
}
document.body.addEventListener('click',e=>{if(e.target.closest('.admOpen'))openAdm();});
$('admClose').addEventListener('click',()=>$('admModal').classList.remove('on'));
$('admCancel').addEventListener('click',()=>$('admModal').classList.remove('on'));
$('admModal').addEventListener('click',e=>{if(e.target===$('admModal'))$('admModal').classList.remove('on');});
$('admGo').addEventListener('click',doAdm);
$('admPw').addEventListener('keydown',e=>{if(e.key==='Enter')doAdm();});
async function doAdm(){
  const pw=$('admPw').value; if(!pw)return;
  $('admGo').disabled=true; $('admErr').textContent='';
  const r=await signIn(CFG.adminEmail,pw);
  $('admGo').disabled=false;
  if(!r.ok){$('admErr').textContent=r.net?t('gateNet'):t('admBad');$('admPw').select();return;}
  $('admPw').value='';
  $('admModal').classList.remove('on');
  await enterApp(r.session);
}
/* 관리자 잠그기 — 직원 계정으로 되돌립니다 */
$('admLockBtn').addEventListener('click',async()=>{
  await sb.auth.signOut();
  isAdmin=false; document.body.classList.remove('adm');
  data=EMPTY();
  if(liveCh){sb.removeChannel(liveCh);liveCh=null;}
  document.body.classList.add('locked');
  $('gate').classList.add('on');
  setTimeout(()=>$('gatePw').focus(),50);
});

async function enterApp(session){
  myEmail=(session&&session.user&&session.user.email)||'';
  isAdmin=!!CFG.adminEmail&&myEmail.toLowerCase()===String(CFG.adminEmail).toLowerCase();
  document.body.classList.toggle('adm',isAdmin);
  $('gate').classList.remove('on');
  document.body.classList.remove('locked');
  setNet('con');
  if(await loadAll())await seedIfEmpty();
  await setLang(LANG,false);
  subscribeLive();
}

/* ══════════ boot ══════════ */
(async()=>{
  try{LANG=localStorage.getItem('hnhy-lang')||'ko';}catch(e){}
  applyI18n();
  if(!CFG.url||!CFG.anonKey||/YOUR-(PROJECT|ANON)/.test(CFG.url+CFG.anonKey)){
    $('gateErr').textContent=t('cfgBad');
    $('gateGo').disabled=true;
    return;
  }
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{
    auth:{persistSession:true,autoRefreshToken:true,storageKey:'hnhy-staff-auth'},
    realtime:{params:{eventsPerSecond:5}}
  });
  const {data:d}=await sb.auth.getSession();
  if(d&&d.session)await enterApp(d.session);
  else setTimeout(()=>$('gatePw').focus(),80);
})();
</script>
